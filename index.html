<!DOCTYPE html>
<html lang="th" class="sa2-auth-pending">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dashboard Performance Sale Admin 2 ‚Äî Enterprise Edition</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800;900&display=swap');
:root{
  /* ‚îÄ‚îÄ Light / Minimal White Theme ‚îÄ‚îÄ */
  --bg:#f4f6fb;--s1:#ffffff;--s2:#f1f4f9;--s3:#e4e9f1;--border:#e2e7f0;--text:#1c2333;--muted:#64748b;
  --neon:#0891b2;--neon2:#7c3aed;
  --glass:rgba(255,255,255,.78);--glass-brd:rgba(15,23,42,.07);
  --shadow-sm:0 2px 10px rgba(30,41,59,.06);--shadow-md:0 8px 26px rgba(30,41,59,.10);--shadow-lg:0 4px 30px rgba(30,41,59,.08);
  --sb-w:236px;--sb-w-collapsed:72px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Sarabun',sans-serif;background:
  radial-gradient(circle at 15% 0%,#7c3aed0d,transparent 40%),
  radial-gradient(circle at 85% 10%,#06b6d40d,transparent 40%),
  var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
::-webkit-scrollbar{width:8px;height:6px;}
::-webkit-scrollbar-thumb{background:#c7d0de;border-radius:4px;}

/* ‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê APP SHELL ‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê */
.app-shell{display:flex;min-height:100vh;}
.main-col{flex:1;min-width:0;}
.wrap{max-width:1560px;margin:0 auto;padding:20px 28px 60px;}

/* ‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê HEADER ‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê */
.hdr{background:var(--glass);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:900;box-shadow:var(--shadow-lg);}
.hdr-top{display:flex;align-items:center;gap:14px;padding:13px 28px;flex-wrap:wrap;}
.hdr-logo{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,#f59e0b,#7c3aed,#06b6d4);display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 4px 20px #7c3aed44;flex-shrink:0;}
.hdr-title{font-size:17px;font-weight:900;letter-spacing:-.3px;}
.hdr-sub{font-size:9.5px;color:var(--muted);margin-top:2px;}
.hdr-right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;}
.hstat{background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:6px 13px;text-align:center;min-width:74px;}
.hstat-v{font-size:14px;font-weight:900;}
.hstat-l{font-size:8px;color:var(--muted);margin-top:1px;}

/* ‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê FILTER BAR ‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê */
.fbar{display:flex;align-items:center;gap:8px;padding:9px 28px;border-top:1px solid var(--border);flex-wrap:wrap;background:#0000001a;}
.fbar-lbl{font-size:8.5px;font-weight:800;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-right:2px;}
.fsel{background:var(--s2);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:6px 10px;font-family:'Sarabun',sans-serif;font-size:10.5px;font-weight:700;cursor:pointer;transition:border-color .15s;}
.fsel:hover{border-color:var(--neon);}
.fchip{display:inline-flex;align-items:center;gap:5px;background:linear-gradient(90deg,#7c3aed14,#06b6d414);border:1px solid #7c3aed3a;color:#6d28d9;border-radius:20px;padding:4px 10px 4px 12px;font-size:9.5px;font-weight:700;}
.fchip button{background:none;border:none;color:currentColor;cursor:pointer;font-size:11px;line-height:1;opacity:.7;}
.fchip button:hover{opacity:1;}
.fclear{font-size:9px;font-weight:700;color:var(--muted);background:none;border:1px solid var(--border);border-radius:20px;padding:4px 12px;cursor:pointer;}
.fclear:hover{color:#dc2626;border-color:#ef444455;}

/* ‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê SIDEBAR (LEFT) ‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê */
.sidebar{width:var(--sb-w);flex-shrink:0;background:var(--s1);border-right:1px solid var(--border);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;transition:width .22s cubic-bezier(.4,0,.2,1);z-index:950;box-shadow:var(--shadow-sm);}
.sidebar.collapsed{width:var(--sb-w-collapsed);}
.sb-head{display:flex;align-items:center;justify-content:space-between;padding:16px 14px;border-bottom:1px solid var(--border);}
.sb-brand{font-size:11px;font-weight:900;color:var(--neon2);white-space:nowrap;overflow:hidden;opacity:1;transition:opacity .15s;}
.sidebar.collapsed .sb-brand{opacity:0;width:0;}
.sb-toggle{background:var(--s2);border:1px solid var(--border);color:var(--muted);width:26px;height:26px;border-radius:8px;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;}
.sb-toggle:hover{color:var(--neon2);border-color:var(--neon2);}
.sb-menu{flex:1;overflow-y:auto;padding:10px 8px;display:flex;flex-direction:column;gap:3px;}
.sb-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--muted);font-size:11.5px;font-weight:700;white-space:nowrap;overflow:hidden;border:1px solid transparent;position:relative;transition:all .18s;}
.sb-item:hover{background:var(--s2);color:var(--text);transform:translateX(2px);}
.sb-item.active{background:linear-gradient(90deg,#7c3aed14,#06b6d414);color:#5b21b6;border-color:#7c3aed30;box-shadow:inset 3px 0 0 var(--neon2);}
.sb-ic{font-size:16px;flex-shrink:0;width:20px;text-align:center;}
.sb-lbl{opacity:1;transition:opacity .12s;}
.sidebar.collapsed .sb-lbl{opacity:0;width:0;}
.sidebar.collapsed .sb-item{justify-content:center;padding:10px 0;}
.sb-foot{padding:12px 16px;border-top:1px solid var(--border);font-size:8px;color:var(--muted);white-space:nowrap;overflow:hidden;}
.sidebar.collapsed .sb-foot{opacity:0;}

/* ‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê PAGES / PANELS ‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê */
.page{display:none;animation:fadein .28s ease;}
.page.active{display:block;}
@keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

/* ‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê PRODUCTS & PROMOTIONS ‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê */
.promo-hero{position:relative;overflow:hidden;border-radius:22px;padding:26px 28px;color:#fff;background:linear-gradient(120deg,#312e81 0%,#6d28d9 55%,#0891b2 100%);box-shadow:0 18px 45px rgba(79,70,229,.22);margin-bottom:16px}
.promo-hero:after{content:'üéÅ';position:absolute;right:34px;top:2px;font-size:105px;opacity:.12;transform:rotate(10deg)}
.promo-eyebrow{font-size:9px;font-weight:900;letter-spacing:2px;opacity:.78;text-transform:uppercase}.promo-title{font-size:24px;font-weight:900;margin:5px 0}.promo-sub{font-size:11px;opacity:.85;max-width:720px;line-height:1.65}
.promo-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:16px 0 24px}.promo-kpi{position:relative;overflow:hidden;border-radius:18px;padding:18px 20px 17px;box-shadow:0 9px 24px rgba(30,41,59,.11);transition:transform .18s ease,box-shadow .18s ease}.promo-kpi:before{content:'';position:absolute;left:0;right:0;top:0;height:6px}.promo-kpi:after{content:'';position:absolute;width:84px;height:84px;border-radius:50%;right:-26px;bottom:-42px;background:currentColor;opacity:.08}.promo-kpi:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(30,41,59,.15)}.promo-kpi b{display:block;font-size:29px;line-height:1;font-weight:900;margin-top:8px}.promo-kpi span{font-size:12px;color:#334155;font-weight:800}.promo-kpi:nth-child(1){color:#4338ca;background:linear-gradient(135deg,#eef2ff,#e0e7ff);border:1px solid #c7d2fe}.promo-kpi:nth-child(1):before{background:linear-gradient(90deg,#4338ca,#818cf8)}.promo-kpi:nth-child(2){color:#047857;background:linear-gradient(135deg,#ecfdf5,#d1fae5);border:1px solid #a7f3d0}.promo-kpi:nth-child(2):before{background:linear-gradient(90deg,#047857,#34d399)}.promo-kpi:nth-child(3){color:#c2410c;background:linear-gradient(135deg,#fff7ed,#ffedd5);border:1px solid #fed7aa}.promo-kpi:nth-child(3):before{background:linear-gradient(90deg,#ea580c,#fb923c)}.promo-kpi:nth-child(4){color:#be185d;background:linear-gradient(135deg,#fdf2f8,#fce7f3);border:1px solid #fbcfe8}.promo-kpi:nth-child(4):before{background:linear-gradient(90deg,#db2777,#f472b6)}
.promo-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.promo-panel{background:#fff;border:1px solid var(--border);border-radius:18px;overflow:hidden;box-shadow:var(--shadow-sm)}.promo-panel.full{grid-column:1/-1}.promo-panel-head{padding:15px 18px;color:#fff;font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:space-between;gap:8px}.promo-panel-head small{font-size:8px;opacity:.85}.ph-indigo{background:linear-gradient(100deg,#3730a3,#7c3aed)}.ph-rose{background:linear-gradient(100deg,#be123c,#db2777)}.ph-green{background:linear-gradient(100deg,#047857,#10b981)}.ph-violet{background:linear-gradient(100deg,#6d28d9,#8b5cf6)}
.promo-body{padding:14px 16px 17px}.promo-table{width:100%;border-collapse:separate;border-spacing:0;font-size:10.5px}.promo-table th{padding:9px 10px;background:#f8fafc;color:#64748b;text-align:left;font-size:8px;letter-spacing:.5px;text-transform:uppercase;border-bottom:1px solid var(--border)}.promo-table td{padding:9px 10px;border-bottom:1px solid #eef2f7;vertical-align:top}.promo-table tr:last-child td{border-bottom:0}.promo-table tbody tr:hover td{background:#faf5ff}.sku{display:inline-flex;padding:3px 8px;border-radius:999px;background:#ede9fe;color:#6d28d9;font-weight:900;font-size:9px;white-space:nowrap}.price{font-weight:900;color:#059669;white-space:nowrap}.brand-pill{display:inline-flex;padding:4px 9px;border-radius:8px;font-weight:900;font-size:9px}.bp-hv{background:#dbeafe;color:#1d4ed8}.bp-tl{background:#fee2e2;color:#b91c1c}.bp-wp{background:#cffafe;color:#0e7490}.bp-jk{background:#ffedd5;color:#c2410c}
.promo-brand-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.promo-brand-card{position:relative;overflow:hidden;border-radius:16px;padding:18px 17px 16px;box-shadow:0 8px 20px rgba(30,41,59,.09);transition:transform .18s ease,box-shadow .18s ease}.promo-brand-card:before{content:'';position:absolute;left:0;top:0;bottom:0;width:6px}.promo-brand-card:hover{transform:translateY(-3px);box-shadow:0 13px 28px rgba(30,41,59,.14)}.promo-brand-card:nth-child(1){background:linear-gradient(135deg,#eff6ff,#dbeafe);border:1px solid #bfdbfe}.promo-brand-card:nth-child(1):before{background:#2563eb}.promo-brand-card:nth-child(2){background:linear-gradient(135deg,#fff1f2,#ffe4e6);border:1px solid #fecdd3}.promo-brand-card:nth-child(2):before{background:#e11d48}.promo-brand-card:nth-child(3){background:linear-gradient(135deg,#ecfeff,#cffafe);border:1px solid #a5f3fc}.promo-brand-card:nth-child(3):before{background:#0891b2}.promo-brand-card:nth-child(4){background:linear-gradient(135deg,#fff7ed,#ffedd5);border:1px solid #fed7aa}.promo-brand-card:nth-child(4):before{background:#ea580c}.promo-brand-card p{font-size:11px;color:#475569;line-height:1.65;margin-top:7px;font-weight:600}.promo-brand-card strong{display:block;font-size:22px;line-height:1.15;margin:11px 0 5px;color:#0f172a}.promo-brand-card .range{font-size:11px;color:#475569;font-weight:800}.promo-brand-card .brand-pill{font-size:10.5px;padding:5px 10px}.condition-list{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.condition{padding:10px 12px;border-radius:10px;background:#fff7ed;color:#9a3412;font-size:9.5px;border:1px solid #fed7aa}.campaign-row{display:grid;grid-template-columns:140px 1fr 100px 1.4fr;gap:0;border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:8px}.campaign-row>div{padding:10px 12px;border-right:1px solid var(--border);font-size:10px}.campaign-row>div:last-child{border-right:0}.campaign-month{font-weight:900;background:#f5f3ff;color:#6d28d9}.campaign-qty{text-align:center;font-weight:900;color:#0891b2}
.product-promo-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.product-promo-card{--brand:#7c3aed;--soft:#f5f3ff;--line:#ddd6fe;overflow:hidden;border:1px solid var(--line);border-radius:17px;background:#fff;box-shadow:0 8px 22px rgba(30,41,59,.09)}.product-promo-card.hv{--brand:#2563eb;--soft:#eff6ff;--line:#bfdbfe}.product-promo-card.tl{--brand:#e11d48;--soft:#fff1f2;--line:#fecdd3}.product-promo-card.wp{--brand:#0891b2;--soft:#ecfeff;--line:#a5f3fc}.product-promo-card.jk{--brand:#ea580c;--soft:#fff7ed;--line:#fed7aa}.product-promo-title{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px;background:linear-gradient(135deg,var(--soft),#fff);border-top:5px solid var(--brand);border-bottom:1px solid var(--line)}.product-promo-title strong{font-size:14px;color:#0f172a}.product-promo-title span{font-size:9px;font-weight:900;color:var(--brand);background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 8px;white-space:nowrap}.product-promo-list{list-style:none;margin:0;padding:5px 12px 10px}.product-promo-list li{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;min-height:42px;padding:8px 2px;border-bottom:1px dashed #e2e8f0;color:#334155;font-size:11.5px;font-weight:700;line-height:1.4}.product-promo-list li:last-child{border-bottom:0}.product-promo-list .sku{font-size:10px;padding:4px 8px;background:var(--soft);color:var(--brand);border:1px solid var(--line)}
@media(max-width:1100px){.product-promo-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:1000px){.promo-brand-cards{grid-template-columns:repeat(2,1fr)}.promo-kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.promo-hero{padding:20px}.promo-title{font-size:19px}.promo-grid{grid-template-columns:1fr}.promo-panel.full{grid-column:auto}.promo-brand-cards,.promo-kpis,.condition-list{grid-template-columns:1fr}.product-promo-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.product-promo-title{padding:11px 9px;display:block}.product-promo-title strong{font-size:12px}.product-promo-title span{display:inline-flex;margin-top:5px;font-size:8px}.product-promo-list{padding:4px 7px 7px}.product-promo-list li{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:4px;min-height:58px;padding:7px 1px;font-size:10.5px}.product-promo-list .sku{font-size:9px}.campaign-row{grid-template-columns:1fr 1fr}.campaign-row>div:nth-child(2){border-right:0}.campaign-row>div{border-bottom:1px solid var(--border)}.campaign-row>div:nth-last-child(-n+2){border-bottom:0}}

/* ‚îÄ‚îÄ SEC ‚îÄ‚îÄ */
.sec{display:flex;align-items:center;gap:10px;font-size:8.5px;font-weight:800;letter-spacing:3px;color:var(--muted);text-transform:uppercase;margin:24px 0 12px;}
.sec::after{content:'';flex:1;height:1px;background:var(--border);}

/* ‚îÄ‚îÄ KPI ‚îÄ‚îÄ */
.krow{display:grid;gap:12px;}
.k3{grid-template-columns:repeat(3,1fr);}
.k4{grid-template-columns:repeat(4,1fr);}
.k5{grid-template-columns:repeat(5,1fr);}
.k6{grid-template-columns:repeat(6,1fr);}
.kpi{background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--glass-brd);border-radius:14px;padding:16px 18px;position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s;cursor:default;}
.kpi.clickable{cursor:pointer;}
.kpi:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);}
.kpi-stripe{position:absolute;top:0;left:0;right:0;height:3px;}
.kpi-ic{font-size:20px;margin-bottom:7px;}
.kpi-lbl{font-size:8.5px;color:var(--muted);font-weight:700;margin-bottom:3px;}
.kpi-val{font-size:22px;font-weight:900;line-height:1.1;}
.kpi-sub{font-size:9px;color:var(--muted);margin-top:5px;}
.kpi-spark{margin-top:6px;height:22px;}

/* ‚îÄ‚îÄ EXECUTIVE OVERVIEW ‚Äî COLORFUL KPI CARDS ‚îÄ‚îÄ */
#pg-dashboard>.sec{font-size:14px;font-weight:950;letter-spacing:.8px;color:#312e81;margin:27px 0 15px;text-transform:none}
#pg-dashboard>.sec::after{height:3px;border-radius:999px;background:linear-gradient(90deg,#7c3aed,#06b6d4,#10b981,#f59e0b,#f43f5e,transparent)}
#ex-kpi{gap:16px}
#ex-kpi .kpi{
  --ex1:#7c3aed;--ex2:#a855f7;
  min-height:154px;padding:21px 20px 18px;border:1px solid rgba(255,255,255,.96);
  border-radius:23px;background:linear-gradient(145deg,#fff 8%,color-mix(in srgb,var(--ex1) 10%,#fff) 62%,color-mix(in srgb,var(--ex2) 18%,#fff));
  box-shadow:0 14px 32px color-mix(in srgb,var(--ex1) 18%,transparent),inset 0 1px 0 #fff;
  isolation:isolate;transition:transform .24s cubic-bezier(.2,.8,.2,1),box-shadow .24s ease,border-color .24s ease
}
#ex-kpi .kpi:nth-child(1){--ex1:#059669;--ex2:#34d399}
#ex-kpi .kpi:nth-child(2){--ex1:#ea580c;--ex2:#f59e0b}
#ex-kpi .kpi:nth-child(3){--ex1:#0891b2;--ex2:#22d3ee}
#ex-kpi .kpi:nth-child(4){--ex1:#7c3aed;--ex2:#c026d3}
#ex-kpi .kpi:nth-child(5){--ex1:#059669;--ex2:#10b981}
#ex-kpi .kpi:nth-child(6){--ex1:#e11d48;--ex2:#fb7185}
#ex-kpi .kpi:nth-child(7){--ex1:#0f9f6e;--ex2:#2dd4bf}
#ex-kpi .kpi:nth-child(8){--ex1:#0284c7;--ex2:#38bdf8}
#ex-kpi .kpi:nth-child(9){--ex1:#d97706;--ex2:#fbbf24}
#ex-kpi .kpi:nth-child(10){--ex1:#db2777;--ex2:#f472b6}
#ex-kpi .kpi:nth-child(11){--ex1:#dc2626;--ex2:#fb7185}
#ex-kpi .kpi:nth-child(12){--ex1:#9333ea;--ex2:#e879f9}
#ex-kpi .kpi:nth-child(13){--ex1:#be123c;--ex2:#fb7185}
#ex-kpi .kpi::before{
  content:'';position:absolute;z-index:-1;width:112px;height:112px;right:-32px;bottom:-46px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,color-mix(in srgb,var(--ex2) 40%,#fff),var(--ex1));opacity:.20;
  transition:transform .3s ease,opacity .3s ease
}
#ex-kpi .kpi::after{
  content:'';position:absolute;z-index:2;inset:0 auto 0 -45%;width:32%;
  background:linear-gradient(100deg,transparent,#ffffff9c,transparent);transform:skewX(-18deg);opacity:0
}
#ex-kpi .kpi:hover{transform:translateY(-7px) scale(1.018);border-color:color-mix(in srgb,var(--ex1) 35%,#fff);box-shadow:0 22px 42px color-mix(in srgb,var(--ex1) 27%,transparent),inset 0 1px 0 #fff}
#ex-kpi .kpi:hover::before{transform:scale(1.25);opacity:.28}
#ex-kpi .kpi:hover::after{animation:exShine .8s ease}
@keyframes exShine{0%{left:-45%;opacity:0}25%{opacity:.75}100%{left:125%;opacity:0}}
#ex-kpi .kpi-stripe{height:7px;background:linear-gradient(90deg,var(--ex1),var(--ex2))!important;box-shadow:0 3px 12px color-mix(in srgb,var(--ex1) 40%,transparent)}
#ex-kpi .kpi-ic{

/* ‚îÄ‚îÄ CROSS SALE DAILY ‚îÄ‚îÄ */

.rd-legend.normal{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe;}
.rd-legend.wait{background:#f8fafc;color:#64748b;border-color:#e2e8f0;}
#rd-daily-section .scrl{padding:14px 16px 16px;background:linear-gradient(180deg,#f8fffd,#fff);}

/* ‚îÄ‚îÄ STAFF CARDS ‚îÄ‚îÄ */
.scrd{background:var(--s1);border:1px solid var(--border);border-radius:14px;padding:16px;position:relative;overflow:hidden;transition:transform .15s;cursor:pointer;box-shadow:var(--shadow-sm);}
.scrd:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);}
.scrd.sel{border-color:var(--neon);box-shadow:0 0 0 1px var(--neon);}
.scrd-stripe{position:absolute;top:0;left:0;right:0;height:3px;}
.scrd-name{font-size:15px;font-weight:900;}
.scrd-sub{font-size:8.5px;color:var(--muted);margin-top:2px;margin-bottom:10px;}
.scrd-nums{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px;}
.sn{background:var(--s2);border-radius:8px;padding:7px 10px;}

.sn-v{font-size:13px;font-weight:900;}
.pbar-hdr{display:flex;justify-content:space-between;font-size:8px;margin-bottom:3px;}
.msbar{height:7px;background:var(--s3);border-radius:4px;overflow:hidden;display:flex;margin-bottom:7px;}
.msb-p{background:#10b981;height:100%;} .msb-f{background:#ef4444;height:100%;} .msb-o{background:#374151;height:100%;}

/* ‚îÄ‚îÄ LEADERBOARD ‚îÄ‚îÄ */
.lb{display:flex;flex-direction:column;gap:6px;}
.lb-row{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;background:var(--s2);border:1px solid var(--border);cursor:pointer;transition:transform .12s;}

.lb-row.bronze{border-color:#b4530966;background:linear-gradient(90deg,#b4530918,var(--s2));}
.lb-rk{font-size:13px;font-weight:900;width:22px;text-align:center;flex-shrink:0;}
.lb-nm{font-size:11px;font-weight:800;width:56px;flex-shrink:0;}
.lb-bw{flex:1;background:var(--s3);border-radius:3px;height:6px;overflow:hidden;}
.lb-bf{height:100%;border-radius:3px;}
.lb-rv{font-size:12px;font-weight:900;min-width:70px;text-align:right;}
.lb-pp{font-size:9px;font-weight:700;min-width:38px;text-align:right;color:var(--muted);}

/* ‚îÄ‚îÄ BRAND CARD ‚îÄ‚îÄ */
.bcrd{background:var(--s1);border:1px solid var(--border);border-radius:14px;padding:18px;position:relative;overflow:hidden;transition:transform .15s;cursor:pointer;}
.bcrd:hover{transform:translateY(-3px);}
.bcrd.sel{box-shadow:0 0 0 2px var(--neon);}
.bcrd-stripe{position:absolute;top:0;left:0;right:0;height:4px;}
.bcrd-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.bcrd-name{font-size:14px;font-weight:900;}
.bcrd-tgt{font-size:8.5px;color:var(--muted);margin-top:2px;}
.bcrd-ic{font-size:22px;}
.bcrd-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.bst{background:var(--s2);border-radius:8px;padding:7px 10px;}
.bst-l{font-size:7.5px;color:var(--muted);margin-bottom:2px;}
.bst-v{font-size:12px;font-weight:900;}

/* ‚îÄ‚îÄ RING ‚îÄ‚îÄ */
.ring-c{position:relative;width:100px;height:100px;margin:8px auto 10px;}
.ring-svg{width:100px;height:100px;transform:rotate(-90deg);}
.ring-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;}
.ring-pct{font-size:17px;font-weight:900;line-height:1;}

#gpOverviewHeading{
  position:relative;
  margin:30px 0 17px;
  padding:13px 20px 13px 54px;
  border:1px solid rgba(255,255,255,.92);
  border-radius:17px;
  overflow:hidden;
  background:linear-gradient(110deg,#eef2ff 0%,#fdf2f8 48%,#fff7ed 100%);
  box-shadow:0 12px 28px rgba(99,102,241,.14),inset 0 1px 0 #fff;
  color:#312e81;
  font-size:19px;
  font-weight:950;
  letter-spacing:.2px;
  text-transform:none;
  text-shadow:0 2px 0 #fff;
}
#gpOverviewHeading::before{
  content:'üìà';
  position:absolute;
  left:13px;
  top:50%;
  width:31px;
  height:31px;
  display:grid;
  place-items:center;
  border-radius:10px;
  transform:translateY(-50%);
  background:linear-gradient(135deg,#4f46e5,#a855f7,#ec4899);
  box-shadow:0 7px 16px rgba(124,58,237,.32);
  color:#fff;
  font-size:17px;
  text-shadow:none;
}
#gpOverviewHeading::after{
  content:'';
  height:3px;
  margin-left:12px;
  border-radius:99px;
  background:linear-gradient(90deg,#7c3aed,#ec4899,#f97316,#06b6d4,transparent);
}
#gp-kpi{
  gap:16px;
  perspective:1000px;
}
#gp-kpi .kpi{
  --gp-accent:#6366f1;
  --gp-accent2:#a855f7;
  min-height:166px;
  padding:22px 21px 18px;
  border:1px solid color-mix(in srgb,var(--gp-accent) 24%,white);
  border-radius:23px;
  background:
    radial-gradient(circle at 88% 83%,color-mix(in srgb,var(--gp-accent2) 18%,transparent),transparent 35%),
    linear-gradient(145deg,#fff 12%,color-mix(in srgb,var(--gp-accent) 10%,white) 100%);
  box-shadow:0 14px 30px color-mix(in srgb,var(--gp-accent) 18%,transparent),inset 0 1px 0 #fff;
  transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s ease,border-color .25s ease;
}
#gp-kpi .kpi:nth-child(1){--gp-accent:#ef4444;--gp-accent2:#fb7185}
#gp-kpi .kpi:nth-child(2){--gp-accent:#f59e0b;--gp-accent2:#fb923c}
#gp-kpi .kpi:nth-child(3){--gp-accent:#06b6d4;--gp-accent2:#3b82f6}
#gp-kpi .kpi:nth-child(4){--gp-accent:#7c3aed;--gp-accent2:#a855f7}
#gp-kpi .kpi:nth-child(5){--gp-accent:#f43f5e;--gp-accent2:#ec4899}
#gp-kpi .kpi::before{
  content:'';
  position:absolute;
  inset:0;
  z-index:0;
  opacity:0;
  background:linear-gradient(115deg,transparent 18%,rgba(255,255,255,.8) 45%,transparent 70%);
  transform:translateX(-115%);
  pointer-events:none;
}
#gp-kpi .kpi::after{
  content:'';
  position:absolute;
  right:-28px;
  bottom:-34px;
  width:112px;
  height:112px;
  border-radius:50%;
  border:17px solid color-mix(in srgb,var(--gp-accent) 9%,transparent);
  pointer-events:none;
}
#gp-kpi .kpi:hover{
  transform:translateY(-7px) rotateX(2deg);
  border-color:color-mix(in srgb,var(--gp-accent) 42%,white);
  box-shadow:0 23px 42px color-mix(in srgb,var(--gp-accent) 27%,transparent),inset 0 1px 0 #fff;
}
#gp-kpi .kpi:hover::before{animation:gpShine .72s ease}
@keyframes gpShine{to{opacity:1;transform:translateX(115%)}}
#gp-kpi .kpi-stripe{
  height:7px;
  background:linear-gradient(90deg,var(--gp-accent),var(--gp-accent2))!important;

#gp-kpi .kpi-ic{

/* 2026-07-23 DASHBOARD SIMPLIFIED ‚Äî bold, colorful, decision-first */
#pg-dashboard .wrap{background:radial-gradient(circle at 7% 5%,#dbeafeaa,transparent 22%),radial-gradient(circle at 96% 18%,#fce7f3bb,transparent 25%),linear-gradient(180deg,#f8faff,#fffaf5);min-height:100vh;padding-bottom:38px}
#pg-dashboard .hub-hero{min-height:154px;padding:34px 37px;border-radius:30px;background:radial-gradient(circle at 90% 5%,#ffffff38 0 8%,transparent 8.5%),radial-gradient(circle at 84% 120%,#fbbf2444 0 23%,transparent 40%),linear-gradient(115deg,#172554,#3730a3 27%,#7c3aed 56%,#db2777 80%,#f97316);box-shadow:0 27px 58px #5b21b633}
#pg-dashboard .hub-hero:after{content:'‚ú¶';position:absolute;right:6%;top:-62px;font-size:210px;font-weight:950;color:#ffffff14;transform:rotate(14deg)}
#pg-dashboard .hub-eyebrow{font-size:12px;letter-spacing:2.4px;color:#fde68a}
#pg-dashboard .hub-title{font-size:38px;margin-top:10px;letter-spacing:.2px}
#pg-dashboard .hub-sub{font-size:13px;max-width:900px;font-weight:850}
#pg-dashboard .hub-toolbar{position:relative;overflow:hidden;display:grid;grid-template-columns:repeat(5,minmax(145px,1fr)) auto;align-items:end;gap:13px;padding:21px 22px;border:1.5px solid #c4b5fd;border-radius:24px;background:radial-gradient(circle at 0 0,#dbeafe 0,transparent 25%),radial-gradient(circle at 100% 100%,#fce7f3 0,transparent 28%),linear-gradient(135deg,#fff,#faf5ff);box-shadow:0 17px 38px #4338ca20,inset 0 1px 0 #fff}
#pg-dashboard .hub-toolbar:before{content:'';position:absolute;inset:0 0 auto;height:6px;background:linear-gradient(90deg,#2563eb,#7c3aed,#db2777,#f59e0b,#10b981)}
#pg-dashboard .hub-field{position:relative;min-width:0}
#pg-dashboard .hub-field label{margin-bottom:8px;color:#312e81;font-size:11px;font-weight:950;letter-spacing:.1px}
#pg-dashboard .hub-field select{height:48px;padding:0 38px 0 14px;border:1.5px solid #c4b5fd;border-radius:14px;background:linear-gradient(145deg,#fff,#f8f7ff);color:#1e1b4b;font:900 13px Sarabun;box-shadow:0 7px 15px #4f46e50d;transition:.2s}
#pg-dashboard .hub-field:nth-child(1) select{border-color:#93c5fd;background:linear-gradient(145deg,#fff,#eff6ff)}
#pg-dashboard .hub-field:nth-child(2) select{border-color:#c4b5fd;background:linear-gradient(145deg,#fff,#f5f3ff)}
#pg-dashboard .hub-field:nth-child(3) select{border-color:#fdba74;background:linear-gradient(145deg,#fff,#fff7ed)}
#pg-dashboard .hub-field:nth-child(4) select{border-color:#86efac;background:linear-gradient(145deg,#fff,#f0fdf4)}
#pg-dashboard .hub-field:nth-child(5) select{border-color:#f9a8d4;background:linear-gradient(145deg,#fff,#fdf2f8)}
#pg-dashboard .hub-field select:hover,#pg-dashboard .hub-field select:focus{transform:translateY(-2px);border-color:#7c3aed;box-shadow:0 10px 21px #7c3aed20,0 0 0 4px #8b5cf614}
#pg-dashboard .hub-reset{height:48px;padding:0 18px;border-radius:14px;font-size:12px;white-space:nowrap;box-shadow:0 10px 22px #a21caf38;transition:.2s}
#pg-dashboard .hub-reset:hover{transform:translateY(-3px);box-shadow:0 15px 27px #a21caf48;filter:saturate(1.12)}
#pg-dashboard .dash-sec{display:flex;align-items:center;gap:10px;margin:29px 0 14px;font-size:21px;color:#172554;letter-spacing:0}
#pg-dashboard .dash-sec small{padding:5px 10px;border-radius:999px;background:#eef2ff;color:#6366f1;font-size:10px;font-weight:900}
#pg-dashboard #ex-kpi{grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}
#pg-dashboard #ex-kpi .kpi{min-height:138px;padding:18px 19px 16px;border:1.5px solid color-mix(in srgb,var(--ex1) 23%,#fff);border-radius:22px;background:linear-gradient(145deg,#fff 5%,color-mix(in srgb,var(--ex1) 12%,#fff));box-shadow:0 14px 29px color-mix(in srgb,var(--ex1) 20%,transparent),inset 0 1px 0 #fff;transition:.22s}
#pg-dashboard #ex-kpi .kpi:hover{transform:translateY(-6px) scale(1.015);box-shadow:0 24px 45px color-mix(in srgb,var(--ex1) 25%,transparent)}
#pg-dashboard #ex-kpi .kpi-ic{width:39px;height:39px;margin-bottom:7px;font-size:22px;border-radius:13px}
#pg-dashboard #ex-kpi .kpi-lbl{font-size:12.5px;color:#334155}
#pg-dashboard #ex-kpi .kpi-val{font-size:29px!important}
#pg-dashboard #ex-kpi .kpi-sub{font-size:10.5px;margin-top:6px;color:#475569}
.dash-spotlight{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:15px 0}
.spot-card{position:relative;overflow:hidden;display:flex;align-items:center;gap:15px;min-height:96px;padding:15px 20px;border-radius:21px;color:#fff;cursor:pointer;box-shadow:0 14px 30px #1e293b20;transition:.22s}
.spot-card.product{background:radial-gradient(circle at 90% 10%,#ffffff32 0 13%,transparent 13.5%),linear-gradient(125deg,#0f766e,#10b981,#06b6d4)}
.spot-card.person{background:radial-gradient(circle at 90% 10%,#ffffff30 0 13%,transparent 13.5%),linear-gradient(125deg,#9f1239,#e11d48,#f97316)}
.spot-card:hover{transform:translateY(-5px) scale(1.008);box-shadow:0 21px 40px #1e293b30}
.spot-ico{display:grid;place-items:center;width:58px;height:58px;flex:0 0 58px;border:1px solid #ffffff55;border-radius:18px;background:#ffffff24;font-size:30px;box-shadow:inset 0 1px 0 #ffffff70,0 8px 19px #0002}
.spot-card small,.spot-card b,.spot-card span{display:block}.spot-card small{font-size:10px;font-weight:950;color:#fef3c7}.spot-card b{margin-top:2px;font-size:24px;font-weight:950;line-height:1.08;text-shadow:0 3px 12px #0003}.spot-card span{margin-top:3px;font-size:10.5px;font-weight:850}
.dash-brand-tops{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.brand-top-card{--bc:#4f46e5;position:relative;overflow:hidden;min-height:240px;padding:20px 18px;border:1.5px solid color-mix(in srgb,var(--bc) 28%,#e2e8f0);border-radius:24px;background:linear-gradient(155deg,#fff 45%,color-mix(in srgb,var(--bc) 15%,#fff));box-shadow:0 15px 32px color-mix(in srgb,var(--bc) 15%,transparent);cursor:pointer;transition:.22s}
.brand-top-card:before{content:'';position:absolute;inset:0 0 auto;height:8px;background:linear-gradient(90deg,var(--bc),color-mix(in srgb,var(--bc) 45%,#fff))}
.brand-top-card:hover{transform:translateY(-7px);box-shadow:0 24px 44px color-mix(in srgb,var(--bc) 24%,transparent)}
.btc-rank{position:absolute;right:15px;top:17px;font-size:27px;filter:drop-shadow(0 3px 5px #0002)}
.btc-brand{margin-top:8px;color:#172554;font-size:16px;font-weight:950}.btc-sales{margin-top:13px;color:var(--bc);font-size:28px;font-weight:950}.btc-share{margin-top:3px;color:#64748b;font-size:10.5px;font-weight:850}
.btc-leader{margin-top:17px;padding:13px 14px;border:1px solid color-mix(in srgb,var(--bc) 18%,#e2e8f0);border-radius:16px;background:#ffffffd9}.btc-leader span,.btc-leader b,.btc-leader small{display:block}.btc-leader span{color:#64748b;font-size:9px;font-weight:900}.btc-leader b{margin-top:3px;color:#172554;font-size:20px;font-weight:950}.btc-leader small{margin-top:2px;color:var(--bc);font-size:12px;font-weight:900}
#pg-dashboard .dash-performance{gap:14px}
#pg-dashboard .pulse-card{min-height:139px;padding:20px;border-radius:22px;box-shadow:0 15px 32px color-mix(in srgb,var(--pc) 16%,transparent);transition:.2s}
#pg-dashboard .pulse-card:hover{transform:translateY(-5px);box-shadow:0 22px 40px color-mix(in srgb,var(--pc) 24%,transparent)}
#pg-dashboard .pulse-card span{font-size:11px;color:#475569}#pg-dashboard .pulse-card b{font-size:25px}#pg-dashboard .pulse-card small{font-size:10.5px}
#pg-dashboard .dash-brand-board{position:relative;overflow:hidden;padding:23px;border:1.5px solid #c7d2fe;border-radius:28px;background:radial-gradient(circle at 5% 0,#dbeafeaa,transparent 26%),radial-gradient(circle at 95% 100%,#fce7f3aa,transparent 28%),linear-gradient(145deg,#fff,#f8faff);box-shadow:0 20px 42px #3341551c}
#pg-dashboard .dash-brand-board:before{content:'';position:absolute;inset:0 0 auto;height:7px;background:linear-gradient(90deg,#7c3aed,#06b6d4,#f59e0b,#f43f5e)}
#pg-dashboard .tmap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));height:auto;min-height:210px;gap:10px}
#pg-dashboard .tmap-cell{min-height:190px;padding:24px;border:1px solid #ffffff88;border-radius:23px;box-shadow:inset 0 1px 0 #ffffff75,0 17px 32px #1e293b2b;transition:.23s}
#pg-dashboard .tmap-cell:before{content:'‚ú¶';position:absolute;right:17px;top:10px;color:#ffffff3d;font-size:47px;transform:rotate(14deg)}
#pg-dashboard .tmap-cell:hover{transform:translateY(-9px) scale(1.018);filter:saturate(1.18) brightness(1.04);box-shadow:0 27px 44px #1e293b38}
#pg-dashboard .tmap-cell .tn{position:relative;z-index:1;font-size:18px;letter-spacing:.1px}
#pg-dashboard .tmap-cell .tv{position:relative;z-index:1;font-size:34px;letter-spacing:-.7px}
#pg-dashboard .tmap-cell .tp{position:relative;z-index:1;padding:7px 11px;font-size:12px;border-width:1.5px;box-shadow:inset 0 1px 0 #ffffff55}
#pg-dashboard .story-card{border-radius:22px;box-shadow:0 15px 32px #1e293b18}#pg-dashboard .story-label{font-size:13px}#pg-dashboard .story-copy{font-size:12px;line-height:1.75}
#pg-dashboard .trend-panel{padding:22px;border-radius:25px;box-shadow:0 16px 36px #33415518}
#pg-dashboard .trend-title{font-size:17px}
#pg-dashboard .dash-all-menu-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}
#pg-dashboard .dash-menu-card{--mc:#7c3aed;position:relative;overflow:hidden;min-height:156px;padding:19px 20px 18px;border:1px solid color-mix(in srgb,var(--mc) 18%,#fff);border-radius:22px;background:linear-gradient(145deg,#fff,color-mix(in srgb,var(--mc) 8%,#fff));box-shadow:0 14px 30px color-mix(in srgb,var(--mc) 14%,transparent);transition:.2s}
#pg-dashboard .dash-menu-card:before{content:'';position:absolute;inset:0 auto 0 0;width:6px;background:linear-gradient(180deg,var(--mc),color-mix(in srgb,var(--mc) 55%,#fff))}
#pg-dashboard .dash-menu-card:after{content:'';position:absolute;width:105px;height:105px;right:-42px;bottom:-52px;border-radius:50%;background:var(--mc);opacity:.08}
#pg-dashboard .dash-menu-card:hover{transform:translateY(-5px);box-shadow:0 21px 39px color-mix(in srgb,var(--mc) 22%,transparent)}
#pg-dashboard .dash-menu-head{display:flex;align-items:center;gap:10px;margin-bottom:11px;color:#172554;font-size:14px;font-weight:950}
#pg-dashboard .dash-menu-icon{display:grid;place-items:center;width:38px;height:38px;flex:0 0 38px;border-radius:13px;background:color-mix(in srgb,var(--mc) 13%,#fff);font-size:21px;box-shadow:0 7px 15px color-mix(in srgb,var(--mc) 14%,transparent)}
#pg-dashboard .dash-menu-body{position:relative;z-index:1;color:#475569;font-size:11px;font-weight:750;line-height:1.72}
#pg-dashboard .dash-menu-body b{color:var(--mc);font-size:14px;font-weight:950}
#pg-dashboard .dash-menu-body .good{color:#059669;font-weight:900}
#pg-dashboard .dash-menu-body .warn{color:#dc2626;font-weight:900}
@media(max-width:1250px){#pg-dashboard .hub-toolbar{grid-template-columns:repeat(3,minmax(150px,1fr))}}
@media(max-width:1100px){#pg-dashboard #ex-kpi,.dash-brand-tops{grid-template-columns:repeat(2,1fr)}#pg-dashboard .tmap{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:1100px){#pg-dashboard .dash-all-menu-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){#pg-dashboard .hub-hero{min-height:auto;padding:27px 22px}#pg-dashboard .hub-title{font-size:27px}#pg-dashboard .hub-toolbar{grid-template-columns:repeat(2,minmax(0,1fr));padding:18px 15px}.dash-spotlight{grid-template-columns:1fr}.dash-performance{grid-template-columns:repeat(2,1fr)!important}}
@media(max-width:560px){#pg-dashboard .dash-sec{align-items:flex-start;flex-direction:column;font-size:18px}#pg-dashboard .hub-toolbar{grid-template-columns:1fr}#pg-dashboard #ex-kpi,.dash-brand-tops,.dash-performance{grid-template-columns:1fr!important}#pg-dashboard #ex-kpi .kpi{min-height:130px}#pg-dashboard .tmap{grid-template-columns:1fr}.spot-card{padding:18px}.spot-ico{width:59px;height:59px;flex-basis:59px;font-size:30px}.spot-card b{font-size:23px}.brand-top-card{min-height:215px}}
@media(max-width:560px){#pg-dashboard .dash-all-menu-grid{grid-template-columns:1fr}}
/* HOLIDAY SCHEDULE ‚Äî colorful, readable and audit-friendly */
#pg-holiday{--hs-navy:#172554;--hs-blue:#2563eb;--hs-pink:#db2777;--hs-green:#059669;--hs-red:#dc2626;--hs-purple:#7c3aed}
#pg-holiday .hs-hero{position:relative;overflow:hidden;padding:28px 30px;border-radius:25px;color:#fff;background:radial-gradient(circle at 88% 18%,rgba(255,255,255,.24),transparent 25%),linear-gradient(120deg,#172554 0%,#4338ca 48%,#db2777 100%);box-shadow:0 20px 45px rgba(67,56,202,.24)}
#pg-holiday .hs-hero:after{content:"üèñÔ∏è";position:absolute;right:35px;top:9px;font-size:88px;opacity:.15;transform:rotate(-8deg)}
#pg-holiday .hs-eyebrow{font-size:11px;font-weight:950;letter-spacing:1.8px;color:#fde68a}
#pg-holiday .hs-title{margin-top:5px;font-size:30px;font-weight:950;letter-spacing:.2px}
#pg-holiday .hs-sub{margin-top:7px;font-size:13px;font-weight:750;opacity:.9}
#pg-holiday .hs-kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:11px;margin:15px 0}
#pg-holiday .hs-kpi{--kc:#2563eb;position:relative;overflow:hidden;min-height:114px;padding:17px 18px;border:1px solid color-mix(in srgb,var(--kc) 25%,#e2e8f0);border-radius:19px;background:linear-gradient(145deg,#fff 52%,color-mix(in srgb,var(--kc) 14%,#fff));box-shadow:0 10px 24px color-mix(in srgb,var(--kc) 14%,transparent);transition:.22s}
#pg-holiday .hs-kpi:hover{transform:translateY(-4px);box-shadow:0 16px 31px color-mix(in srgb,var(--kc) 24%,transparent)}
#pg-holiday .hs-kpi:before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(90deg,var(--kc),color-mix(in srgb,var(--kc) 35%,white))}
#pg-holiday .hs-kpi span{display:block;color:#64748b;font-size:11px;font-weight:900}
#pg-holiday .hs-kpi b{display:block;margin-top:7px;color:var(--kc);font-size:29px;line-height:1;font-weight:950}
#pg-holiday .hs-kpi small{display:block;margin-top:7px;color:#475569;font-size:10px;font-weight:750}
#pg-holiday .hs-workforce{position:relative;overflow:hidden;margin:16px 0 14px;padding:20px;border:1px solid #c4b5fd;border-radius:24px;background:radial-gradient(circle at 4% 0%,#ddd6fe 0,transparent 28%),radial-gradient(circle at 96% 100%,#fed7aa 0,transparent 29%),linear-gradient(125deg,#eef2ff 0%,#fff 46%,#fff1f2 100%);box-shadow:0 16px 38px rgba(67,56,202,.16),inset 0 1px 0 #fff}
#pg-holiday .hs-workforce-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:13px}
#pg-holiday .hs-workforce-title{color:#312e81;font-size:19px;font-weight:950}
#pg-holiday .hs-workforce-note{margin-top:4px;color:#64748b;font-size:10px;font-weight:800}
#pg-holiday .hs-workforce-period{padding:7px 11px;border:1px solid #c4b5fd;border-radius:999px;background:#fff;color:#6d28d9;font-size:10px;font-weight:950;white-space:nowrap}
#pg-holiday .hs-workforce-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
#pg-holiday .hs-workforce-card{--kc:#2563eb;position:relative;overflow:hidden;min-height:126px;padding:18px 16px 14px;border:1px solid color-mix(in srgb,var(--kc) 34%,#e2e8f0);border-radius:20px;background:linear-gradient(145deg,#fff 48%,color-mix(in srgb,var(--kc) 16%,white) 100%);box-shadow:0 10px 23px color-mix(in srgb,var(--kc) 18%,transparent),inset 0 1px 0 #fff;transition:transform .24s ease,box-shadow .24s ease,border-color .24s ease}
#pg-holiday .hs-workforce-card:before{content:"";position:absolute;inset:0 0 auto;height:6px;background:linear-gradient(90deg,var(--kc),color-mix(in srgb,var(--kc) 35%,#fff));box-shadow:0 2px 8px color-mix(in srgb,var(--kc) 28%,transparent)}
#pg-holiday .hs-workforce-card:hover{transform:translateY(-6px) scale(1.018);border-color:var(--kc);box-shadow:0 19px 34px color-mix(in srgb,var(--kc) 27%,transparent)}
#pg-holiday .hs-workforce-card:after{content:"";position:absolute;right:-27px;bottom:-31px;width:92px;height:92px;border-radius:50%;background:color-mix(in srgb,var(--kc) 15%,transparent);box-shadow:-58px -63px 0 -37px color-mix(in srgb,var(--kc) 18%,transparent)}
#pg-holiday .hs-workforce-label{position:relative;z-index:1;display:flex;align-items:center;gap:8px;color:#1e293b;font-size:11px;font-weight:950;letter-spacing:.1px}
#pg-holiday .hs-workforce-label i{display:grid;place-items:center;width:34px;height:34px;border:1px solid color-mix(in srgb,var(--kc) 22%,white);border-radius:11px;background:linear-gradient(145deg,#fff,color-mix(in srgb,var(--kc) 18%,white));box-shadow:0 6px 13px color-mix(in srgb,var(--kc) 18%,transparent);font-style:normal;font-size:18px;transition:transform .24s ease}
#pg-holiday .hs-workforce-card:hover .hs-workforce-label i{transform:rotate(-7deg) scale(1.12)}
#pg-holiday .hs-workforce-value{position:relative;z-index:1;margin-top:11px;color:var(--kc);font-size:25px;line-height:1.05;font-weight:950;letter-spacing:-.4px;text-shadow:0 3px 10px color-mix(in srgb,var(--kc) 22%,transparent)}
#pg-holiday .hs-workforce-card small{position:relative;z-index:1;display:block;margin-top:7px;color:#475569;font-size:9.5px;font-weight:800;line-height:1.35}
#pg-holiday .hs-rules{margin:0 0 14px;overflow:hidden;border:1px solid #fca5a5;border-radius:18px;background:#fff;box-shadow:0 10px 24px rgba(185,28,28,.10)}
#pg-holiday .hs-rules-title{padding:10px 16px;color:#fff;background:linear-gradient(100deg,#b91c1c,#ef4444);font-size:17px;font-weight:950;text-align:center}
#pg-holiday .hs-rules-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:#fff7ed}
#pg-holiday .hs-rule{display:flex;align-items:flex-start;gap:9px;min-height:70px;padding:12px 13px;border-right:1px solid #fed7aa;background:linear-gradient(145deg,#fff7ed,#fff);color:#9a3412;font-size:10px;font-weight:850;line-height:1.45;transition:background .2s,transform .2s}
#pg-holiday .hs-rule:last-child{border-right:0}
#pg-holiday .hs-rule:hover{position:relative;z-index:1;transform:translateY(-2px);background:#fff}
#pg-holiday .hs-rule-icon{display:grid;flex:0 0 25px;place-items:center;width:25px;height:25px;border-radius:8px;background:#fff;border:1px solid #fed7aa;font-size:13px;box-shadow:0 2px 6px rgba(154,52,18,.08)}
#pg-holiday .hs-toolbar{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;padding:15px 17px;border:1px solid #c7d2fe;border-radius:18px;background:linear-gradient(120deg,#eef2ff,#fff,#fdf2f8);box-shadow:0 8px 22px rgba(67,56,202,.09)}
#pg-holiday .hs-field{display:flex;flex-direction:column;gap:5px;min-width:180px}
#pg-holiday .hs-field label{color:#4338ca;font-size:10px;font-weight:950}
#pg-holiday .hs-select{min-height:39px;padding:0 12px;border:1.5px solid #c7d2fe;border-radius:11px;background:#fff;color:#172554;font-family:inherit;font-size:12px;font-weight:850;outline:none}
#pg-holiday .hs-btn{min-height:39px;padding:0 15px;border:0;border-radius:11px;background:linear-gradient(135deg,#4338ca,#7c3aed);color:#fff;font-family:inherit;font-size:11px;font-weight:950;cursor:pointer;box-shadow:0 7px 16px rgba(79,70,229,.22);transition:.2s}
#pg-holiday .hs-btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
#pg-holiday .hs-legend{display:flex;gap:7px;flex-wrap:wrap;margin-left:auto}
#pg-holiday .hs-pill{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;font-size:10px;font-weight:900;border:1px solid transparent}
#pg-holiday .hs-pill i{width:9px;height:9px;border-radius:3px}
#pg-holiday .hs-card{margin-top:14px;overflow:hidden;border:1px solid #c7d2fe;border-radius:20px;background:#fff;box-shadow:0 15px 35px rgba(30,41,59,.12)}
#pg-holiday .hs-card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:17px 19px;color:#fff;background:linear-gradient(100deg,#312e81,#4f46e5,#0891b2)}
#pg-holiday .hs-card-head strong{font-size:18px;font-weight:950}
#pg-holiday .hs-card-head span{font-size:10px;font-weight:800;opacity:.9}

<style id="assigned-buddy-redesign">
/* Assigned Tasks ‚Äî Buddy redesign, approved 24 Aug 2569 */
#pg-other-work .ow-buddy-panel{
  overflow:hidden;border:1px solid #7de8d3;border-radius:28px;
  background:linear-gradient(145deg,#f3fffb 0%,#f8f6ff 54%,#fff8f1 100%);
  box-shadow:0 18px 46px rgba(38,54,101,.16),0 2px 0 rgba(255,255,255,.9) inset;
}
#pg-other-work .ow-buddy-head{
  min-height:118px;padding:24px 30px;
  background:linear-gradient(105deg,#087b5c 0%,#08a29b 42%,#3184dc 72%,#7029e6 100%);
  border:0;position:relative;overflow:hidden;
}
#pg-other-work .ow-buddy-head:before,
#pg-other-work .ow-buddy-head:after{content:"";position:absolute;border-radius:50%;pointer-events:none}
#pg-other-work .ow-buddy-head:before{width:190px;height:190px;right:8%;top:-105px;background:#ffffff16}
#pg-other-work .ow-buddy-head:after{width:110px;height:110px;right:-22px;bottom:-64px;background:#f472b633}
#pg-other-work .ow-buddy-head>div{position:relative;z-index:1}
#pg-other-work .ow-buddy-head strong{
  color:#fff;font-size:28px!important;line-height:1.2;font-weight:900;
  letter-spacing:.1px;text-shadow:0 3px 12px rgba(12,35,68,.28);
}
#pg-other-work .ow-buddy-head small{
  display:block;margin-top:10px;color:#ddfff7;font-size:13px!important;
  font-weight:750;letter-spacing:.1px
}
#pg-other-work #owBuddyStatus{
  position:relative;z-index:1;padding:11px 18px;border:1px solid #ffffff38;
  border-radius:999px;background:#ffffff22;color:#fff;font-size:12px;font-weight:900;
  box-shadow:0 8px 22px rgba(45,24,115,.2),0 1px 0 #ffffff30 inset;
}
#pg-other-work .ow-buddy-panel .ow-body{padding:24px!important;background:transparent}
#pg-other-work .ow-buddy-toolbar{
  gap:14px;padding:18px;border:1px solid #6ce0ca;border-radius:20px;
  background:linear-gradient(100deg,#eafff7 0%,#f8fbff 48%,#f5edff 100%);
  box-shadow:0 10px 24px rgba(34,77,99,.09),0 1px 0 #fff inset;
}
#pg-other-work .ow-buddy-toolbar .ow-field label{
  margin-bottom:8px;color:#087762;font-size:12px!important;font-weight:900
}
#pg-other-work .ow-buddy-toolbar select{
  height:50px!important;border:2px solid #79dfd0!important;border-radius:15px!important;
  background:#fff!important;color:#18233a!important;font-size:13px!important;font-weight:800!important;
  box-shadow:0 5px 14px rgba(29,80,101,.07);transition:.22s ease
}
#pg-other-work .ow-buddy-toolbar select:hover,
#pg-other-work .ow-buddy-toolbar select:focus{
  border-color:#6d5ce8!important;box-shadow:0 0 0 4px #7658e817,0 9px 20px rgba(69,57,151,.13);
  transform:translateY(-1px)
}
#pg-other-work .ow-buddy-reset{
  min-height:50px!important;border-radius:15px!important;
  background:linear-gradient(105deg,#099985,#476fe0 58%,#7928dc)!important;
  box-shadow:0 10px 22px rgba(109,40,217,.27)!important;font-size:12px!important;font-weight:900!important;
  transition:.22s ease
}
#pg-other-work .ow-buddy-reset:hover{transform:translateY(-3px) scale(1.02);filter:saturate(1.16)}
#pg-other-work .ow-buddy-panel .ow-scroll{margin-top:22px;border-radius:18px;overflow:auto}
#pg-other-work table.ow-buddy{border-collapse:separate!important;border-spacing:0 10px!important;background:transparent!important}
#pg-other-work .ow-buddy thead th{
  height:54px;padding:0 20px!important;border:0!important;
  background:linear-gradient(100deg,#076d59,#079d91 56%,#1289b4)!important;
  color:#fff!important;font-size:13px!important;font-weight:900!important;text-shadow:0 2px 7px #00504755
}
#pg-other-work .ow-buddy thead th:first-child{border-radius:15px 0 0 15px}
#pg-other-work .ow-buddy thead th:last-child{border-radius:0 15px 15px 0}
#pg-other-work .ow-buddy tbody tr{
  --row1:#edf7ff;--row2:#f4efff;--edge:#3b82f6;--ink:#2556c7;
  filter:drop-shadow(0 7px 8px rgba(34,56,96,.10));transition:.22s ease
}
#pg-other-work .ow-buddy tbody tr:nth-child(2),
#pg-other-work .ow-buddy tbody tr:nth-child(4){--row1:#fff4df;--row2:#fff1ed;--edge:#f59e0b;--ink:#a55c00}
#pg-other-work .ow-buddy tbody tr:nth-child(5),
#pg-other-work .ow-buddy tbody tr:nth-child(6){--row1:#e5fff7;--row2:#eaf4ff;--edge:#10b7a2;--ink:#087e74}
#pg-other-work .ow-buddy tbody tr:nth-child(7),
#pg-other-work .ow-buddy tbody tr:nth-child(8){--row1:#fff0df;--row2:#f6edff;--edge:#e8811d;--ink:#9a5410}
#pg-other-work .ow-buddy tbody tr:hover{transform:translateY(-3px) scale(1.003);filter:drop-shadow(0 12px 13px rgba(39,58,104,.17))}
#pg-other-work .ow-buddy tbody td{
  height:58px;padding:10px 20px!important;border-width:1px 0!important;border-style:solid!important;
  border-color:color-mix(in srgb,var(--edge) 35%,#fff)!important;
  background:linear-gradient(100deg,var(--row1),var(--row2))!important;font-size:14px!important
}
#pg-other-work .ow-buddy tbody td:first-child{border-left:8px solid var(--edge)!important;border-radius:16px 0 0 16px}
#pg-other-work .ow-buddy tbody td:last-child{border-right:1px solid color-mix(in srgb,var(--edge) 35%,#fff)!important;border-radius:0 16px 16px 0}
#pg-other-work .ow-topic{color:var(--ink)!important;font-size:15px!important;font-weight:900!important}
#pg-other-work .ow-owner{
  padding:8px 14px!important;border:1px solid #ffffffaa;border-radius:999px!important;
  background:linear-gradient(135deg,#e5ddff,#d9e9ff)!important;color:#6040ca!important;
  font-size:12px!important;font-weight:900!important;box-shadow:0 5px 12px rgba(90,65,190,.12)
}
#pg-other-work .ow-buddy-pill{
  padding:9px 16px!important;border:1px solid #ffffffc4;border-radius:999px!important;
  background:linear-gradient(135deg,#bff8e5,#9ceecf)!important;color:#07745a!important;
  font-size:12px!important;font-weight:900!important;box-shadow:0 7px 15px rgba(13,148,111,.18)
}
@media(max-width:760px){
  #pg-other-work .ow-buddy-head{min-height:104px;padding:20px}
  #pg-other-work .ow-buddy-head strong{font-size:22px!important}
  #pg-other-work .ow-buddy-panel .ow-body{padding:14px!important}
  #pg-other-work .ow-buddy tbody td{font-size:12px!important;padding:8px 12px!important}
}
</style>
</head>
