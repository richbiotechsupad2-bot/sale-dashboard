.card{background:var(--s1);border:1px solid var(--border);border-radius:14px;padding:18px 20px;transition:box-shadow .15s;box-shadow:var(--shadow-sm);}

.ct{font-size:12px;font-weight:800;display:flex;align-items:center;gap:7px;margin-bottom:3px;}
.cs{font-size:9px;color:var(--muted);margin-bottom:14px;}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

/* ── GRIDS ── */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px;}
.g31{display:grid;grid-template-columns:3fr 1fr;gap:14px;}
.g3s{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}

/* ── HEATMAP ── */
.hmap{width:100%;border-collapse:collapse;font-size:11px;}
.hmap th{background:var(--s2);color:var(--muted);font-size:8px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:9px 12px;text-align:center;border:1px solid var(--border);}

.cfm{background:#ef444415;color:#dc2626;} .cfh{background:#ef444428;color:#ef4444;}
.delta{font-size:8px;opacity:.7;display:block;margin-top:1px;}

/* ── TABLE ── */
.tbl{width:100%;border-collapse:collapse;font-size:11px;}
.tbl thead th{background:var(--s2);color:var(--muted);font-size:8px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:8px 10px;text-align:right;border-bottom:2px solid var(--border);}

.tbl tfoot td{background:var(--s2);font-weight:900;border-top:2px solid var(--border);padding:8px 10px;text-align:right;}
.tbl tfoot td:first-child{text-align:left;}

/* ── CROSS SALE DAILY ── */
#rd-daily-heading{margin-top:22px;color:#047857;letter-spacing:2px;}

.rd-daily-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:17px 20px;background:linear-gradient(115deg,#d1fae5 0%,#ccfbf1 48%,#dbeafe 100%);border-bottom:1px solid #99f6e4;}
.rd-daily-title{display:flex;align-items:center;gap:11px;}
.rd-daily-icon{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,#059669,#0d9488);color:#fff;font-size:17px;box-shadow:0 6px 14px rgba(5,150,105,.22);}

.rd-daily-title .cs{margin:2px 0 0;font-size:9px;}
.rd-daily-legend{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}

.rd-legend.normal{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe;}
.rd-legend.wait{background:#f8fafc;color:#64748b;border-color:#e2e8f0;}
#rd-daily-section .scrl{padding:14px 16px 16px;background:linear-gradient(180deg,#f8fffd,#fff);}
#rd-daily{width:100%;table-layout:fixed;min-width:560px;border-collapse:separate;border-spacing:0;overflow:hidden;border:1px solid #cbd5e1;border-radius:13px;box-shadow:0 5px 16px rgba(15,118,110,.06);}
#rd-daily th{background:linear-gradient(180deg,#0f766e,#0d9488);color:#fff;padding:10px 7px;border-bottom:0;border-right:1px solid rgba(255,255,255,.14);font-size:8px;letter-spacing:.55px;text-align:center;}

#rd-daily tbody tr:nth-child(even) td{background:#f0fdfa;}
#rd-daily tbody tr:last-child td{border-bottom:0;}

#rd-daily th:nth-child(2),#rd-daily td:nth-child(2){width:80px;}

#rd-daily th:nth-child(4),#rd-daily td:nth-child(4){width:98px;}
#rd-daily th:nth-child(5),#rd-daily td:nth-child(5){width:98px;}
#rd-daily th:nth-child(6),#rd-daily td:nth-child(6){width:98px;}
.rd-date{font-weight:800;color:#334155;}
.rd-status{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-width:72px;padding:4px 9px;border-radius:999px;font-size:9px;font-weight:900;border:1px solid transparent;}
.rd-status::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor;}
.rd-status.high{background:#fdf2f8;color:#be185d;border-color:#fbcfe8;}
.rd-status.normal{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe;}

@media(max-width:700px){.rd-daily-head{align-items:flex-start;flex-direction:column;padding:14px 16px}.rd-daily-legend{justify-content:flex-start}.rd-daily-title .ct{font-size:12px}#rd-daily-section .scrl{padding:10px}}

/* ── STAFF CARDS ── */
.scrd{background:var(--s1);border:1px solid var(--border);border-radius:14px;padding:16px;position:relative;overflow:hidden;transition:transform .15s;cursor:pointer;box-shadow:var(--shadow-sm);}
.scrd:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);}
.scrd.sel{border-color:var(--neon);box-shadow:0 0 0 1px var(--neon);}
.scrd-stripe{position:absolute;top:0;left:0;right:0;height:3px;}
.scrd-name{font-size:15px;font-weight:900;}
.scrd-sub{font-size:8.5px;color:var(--muted);margin-top:2px;margin-bottom:10px;}
.scrd-nums{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px;}
.sn{background:var(--s2);border-radius:8px;padding:7px 10px;}
.sn-l{font-size:7.5px;color:var(--muted);margin-bottom:2px;}
.sn-v{font-size:13px;font-weight:900;}
.pbar-hdr{display:flex;justify-content:space-between;font-size:8px;margin-bottom:3px;}
.msbar{height:7px;background:var(--s3);border-radius:4px;overflow:hidden;display:flex;margin-bottom:7px;}
.msb-p{background:#10b981;height:100%;} .msb-f{background:#ef4444;height:100%;} .msb-o{background:#374151;height:100%;}

/* ── LEADERBOARD ── */
.lb{display:flex;flex-direction:column;gap:6px;}
.lb-row{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;background:var(--s2);border:1px solid var(--border);cursor:pointer;transition:transform .12s;}
.lb-row:hover{transform:translateX(-3px);}
.lb-row.gold{border-color:#f59e0b66;background:linear-gradient(90deg,#f59e0b18,var(--s2));}
.lb-row.silver{border-color:#94a3b866;background:linear-gradient(90deg,#94a3b818,var(--s2));}
.lb-row.bronze{border-color:#b4530966;background:linear-gradient(90deg,#b4530918,var(--s2));}
.lb-rk{font-size:13px;font-weight:900;width:22px;text-align:center;flex-shrink:0;}
.lb-nm{font-size:11px;font-weight:800;width:56px;flex-shrink:0;}
.lb-bw{flex:1;background:var(--s3);border-radius:3px;height:6px;overflow:hidden;}
.lb-bf{height:100%;border-radius:3px;}
.lb-rv{font-size:12px;font-weight:900;min-width:70px;text-align:right;}
.lb-pp{font-size:9px;font-weight:700;min-width:38px;text-align:right;color:var(--muted);}

/* ── BRAND CARD ── */
.bcrd{background:var(--s1);border:1px solid var(--border);border-radius:14px;padding:18px;position:relative;overflow:hidden;transition:transform .15s;cursor:pointer;}
.bcrd:hover{transform:translateY(-3px);}
.bcrd.sel{box-shadow:0 0 0 2px var(--neon);}
.bcrd-stripe{position:absolute;top:0;left:0;right:0;height:4px;}
.bcrd-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.bcrd-name{font-size:14px;font-weight:900;}
.bcrd-tgt{font-size:8.5px;color:var(--muted);margin-top:2px;}
.bcrd-ic{font-size:22px;}
.bcrd-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.bst{background:var(--s2);border-radius:8px;padding:7px 10px;}
.bst-l{font-size:7.5px;color:var(--muted);margin-bottom:2px;}
.bst-v{font-size:12px;font-weight:900;}

/* ── RING ── */
.ring-c{position:relative;width:100px;height:100px;margin:8px auto 10px;}
.ring-svg{width:100px;height:100px;transform:rotate(-90deg);}
.ring-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;}
.ring-pct{font-size:17px;font-weight:900;line-height:1;}
.ring-lbl{font-size:7px;color:var(--muted);margin-top:1px;}

/* ── ALERT / INSIGHT ── */
.alert{border-radius:11px;padding:11px 16px;display:flex;align-items:center;gap:11px;border:1px solid;margin-bottom:10px;font-size:10.5px;}
.aw{background:#f59e0b0d;border-color:#f59e0b44;color:#b45309;}
.ad{background:#ef44440d;border-color:#ef444444;color:#b91c1c;}
.ai{background:#06b6d40d;border-color:#06b6d444;color:#0e7490;}
.ag{background:#10b9810d;border-color:#10b98144;color:#047857;}
.insight-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.icard{background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--glass-brd);border-radius:14px;padding:16px 18px;}
.icard-h{font-size:11.5px;font-weight:900;display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.icard-b{font-size:11px;line-height:1.7;color:var(--text);}
.icard-b b{color:#b45309;}
.icard-b .g{color:#059669;font-weight:800;}
.icard-b .r{color:#dc2626;font-weight:800;}

/* ── CALENDAR ── */
.cal-scrl{overflow-x:auto;}
.cal{border-collapse:collapse;min-width:900px;width:100%;}
.cal th{background:var(--s2);color:var(--muted);font-size:7.5px;font-weight:700;padding:6px 3px;text-align:center;border:1px solid var(--border);}
.cal td{padding:5px 3px;text-align:center;border:1px solid var(--border);font-size:8px;font-weight:700;}
.cal td:first-child{text-align:left;font-size:9px;font-weight:800;background:var(--s2);padding:5px 8px;white-space:nowrap;}
.ccp{background:#10b98128;color:#059669;} .ccf{background:#ef444415;color:#dc2626;} .cce{background:var(--s3);color:var(--border);}

/* ── UNIT TABLE ── */
.utbl{width:100%;border-collapse:collapse;font-size:11px;}
.utbl th{background:var(--s2);color:var(--muted);font-size:8px;font-weight:700;padding:8px 10px;text-align:center;border:1px solid var(--border);}
.utbl th:first-child{text-align:left;}
.utbl td{padding:8px 10px;text-align:center;border:1px solid var(--border);font-weight:700;}
.utbl td:first-child{text-align:left;}
.utbl tfoot td{background:var(--s2);font-weight:900;border-top:2px solid var(--border);}
.u0{color:var(--border);} .u1{background:#10b98112;color:#10b981;} .u2{background:#10b98122;color:#059669;}
.u3{background:#10b98135;color:#047857;} .u4{background:#10b98150;color:#047857;font-weight:900;}

/* ── TREEMAP (custom, div-based) ── */
.tmap{display:flex;flex-wrap:wrap;gap:4px;height:220px;}

/* Executive storytelling — vivid, large-type redesign */
.story-zone{position:relative;overflow:hidden;border-radius:22px;padding:18px;background:linear-gradient(135deg,#eff6ff 0%,#f5f3ff 48%,#fff1f2 100%);border:1px solid #ddd6fe;box-shadow:0 14px 34px rgba(76,29,149,.10)}
.story-zone:before{content:"";position:absolute;width:230px;height:230px;border-radius:50%;right:-90px;top:-120px;background:radial-gradient(circle,#c4b5fd88,transparent 68%);pointer-events:none}
.story-grid{position:relative;display:grid;grid-template-columns:1.45fr .8fr;gap:13px}
.story-card{position:relative;overflow:hidden;border:1px solid #e2e8f0;border-radius:17px;padding:17px 18px 17px 21px;background:#fff;box-shadow:0 8px 22px rgba(30,41,59,.08);transition:transform .2s ease,box-shadow .2s ease}

.story-label{display:flex;align-items:center;gap:9px;color:#475569;font-size:12px;font-weight:900;margin-bottom:8px}
.story-icon{display:grid;place-items:center;width:35px;height:35px;border-radius:11px;background:color-mix(in srgb,var(--story-color) 14%,white);font-size:18px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--story-color) 28%,white)}
.story-copy{font-size:14px;line-height:1.8;color:#334155;font-weight:650}.story-copy b{font-size:16px;color:#312e81}.story-copy .g{color:#047857;font-weight:900}.story-copy .r{color:#dc2626;font-weight:900}
.story-action{margin-top:11px;display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;background:#fff7ed;color:#c2410c;border:1px solid #fed7aa;font-size:11px;font-weight:900}
.visual-panel{border-radius:22px!important;border:1px solid #dbeafe!important;padding:18px!important;background:linear-gradient(145deg,#fff,#f8fbff)!important;box-shadow:0 14px 34px rgba(30,64,175,.09)!important}
.tmap{gap:7px;height:255px}
.tmap-cell{position:relative;border-radius:15px;padding:15px 17px;box-shadow:inset 0 0 0 1px #ffffff44,0 8px 18px rgba(15,23,42,.14);transition:transform .2s ease,filter .2s ease,box-shadow .2s ease}
.tmap-cell:after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#ffffff28,transparent 48%);pointer-events:none}
.tmap-cell:hover{transform:translateY(-4px) scale(1.012);filter:saturate(1.14);box-shadow:0 15px 25px rgba(15,23,42,.20);z-index:2}

/* ══════════════ GP OVERVIEW — COLORFUL KPI REFRESH ══════════════ */
#gpOverviewHeading{
  position:relative;
  margin:30px 0 17px;
  padding:13px 20px 13px 54px;
  border:1px solid rgba(255,255,255,.92);
  border-radius:17px;
  overflow:hidden;
  background:linear-gradient(110deg,#eef2ff 0%,#fdf2f8 48%,#fff7ed 100%);
  box-shadow:0 12px 28px rgba(99,102,241,.14),inset 0 1px 0 #fff;
  color:#312e81;
  font-size:19px;
  font-weight:950;
  letter-spacing:.2px;
  text-transform:none;
  text-shadow:0 2px 0 #fff;
}
#gpOverviewHeading::before{
  content:'📈';
  position:absolute;
  left:13px;
  top:50%;
  width:31px;
  height:31px;
  display:grid;
  place-items:center;
  border-radius:10px;
  transform:translateY(-50%);
  background:linear-gradient(135deg,#4f46e5,#a855f7,#ec4899);
  box-shadow:0 7px 16px rgba(124,58,237,.32);
  color:#fff;
  font-size:17px;
  text-shadow:none;
}
#gpOverviewHeading::after{
  content:'';
  height:3px;
  margin-left:12px;
  border-radius:99px;
  background:linear-gradient(90deg,#7c3aed,#ec4899,#f97316,#06b6d4,transparent);
}
#gp-kpi{
  gap:16px;
  perspective:1000px;
}
#gp-kpi .kpi{
  --gp-accent:#6366f1;
  --gp-accent2:#a855f7;
  min-height:166px;
  padding:22px 21px 18px;
  border:1px solid color-mix(in srgb,var(--gp-accent) 24%,white);
  border-radius:23px;
  background:
    radial-gradient(circle at 88% 83%,color-mix(in srgb,var(--gp-accent2) 18%,transparent),transparent 35%),
    linear-gradient(145deg,#fff 12%,color-mix(in srgb,var(--gp-accent) 10%,white) 100%);
  box-shadow:0 14px 30px color-mix(in srgb,var(--gp-accent) 18%,transparent),inset 0 1px 0 #fff;
  transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s ease,border-color .25s ease;
}
#gp-kpi .kpi:nth-child(1){--gp-accent:#ef4444;--gp-accent2:#fb7185}
#gp-kpi .kpi:nth-child(2){--gp-accent:#f59e0b;--gp-accent2:#fb923c}
#gp-kpi .kpi:nth-child(3){--gp-accent:#06b6d4;--gp-accent2:#3b82f6}
#gp-kpi .kpi:nth-child(4){--gp-accent:#7c3aed;--gp-accent2:#a855f7}
#gp-kpi .kpi:nth-child(5){--gp-accent:#f43f5e;--gp-accent2:#ec4899}
#gp-kpi .kpi::before{
  content:'';
  position:absolute;
  inset:0;
  z-index:0;
  opacity:0;
  background:linear-gradient(115deg,transparent 18%,rgba(255,255,255,.8) 45%,transparent 70%);
  transform:translateX(-115%);
  pointer-events:none;
}
#gp-kpi .kpi::after{
  content:'';
  position:absolute;
  right:-28px;
  bottom:-34px;
  width:112px;
  height:112px;
  border-radius:50%;
  border:17px solid color-mix(in srgb,var(--gp-accent) 9%,transparent);
  pointer-events:none;
}
#gp-kpi .kpi:hover{
  transform:translateY(-7px) rotateX(2deg);
  border-color:color-mix(in srgb,var(--gp-accent) 42%,white);
  box-shadow:0 23px 42px color-mix(in srgb,var(--gp-accent) 27%,transparent),inset 0 1px 0 #fff;
}
#gp-kpi .kpi:hover::before{animation:gpShine .72s ease}
@keyframes gpShine{to{opacity:1;transform:translateX(115%)}}
#gp-kpi .kpi-stripe{
  height:7px;
  background:linear-gradient(90deg,var(--gp-accent),var(--gp-accent2))!important;
  box-shadow:0 3px 12px color-mix(in srgb,var(--gp-accent) 34%,transparent);
}
#gp-kpi .kpi-ic{
  position:relative;
  z-index:1;
  width:40px;
  height:40px;
  margin:1px 0 10px;
  display:grid;
  place-items:center;
  border:1px solid rgba(255,255,255,.92);
  border-radius:13px;
  background:linear-gradient(135deg,#fff,color-mix(in srgb,var(--gp-accent) 16%,white));
  box-shadow:0 8px 18px color-mix(in srgb,var(--gp-accent) 22%,transparent);
  font-size:23px;
  transition:transform .25s ease;
}
#gp-kpi .kpi:hover .kpi-ic{transform:rotate(-7deg) scale(1.08)}
#gp-kpi .kpi-lbl{
  position:relative;
  z-index:1;
  margin-bottom:5px;
  color:#334155;
  font-size:12px;
  font-weight:900;
  letter-spacing:.1px;
}
#gp-kpi .kpi-val{
  position:relative;
  z-index:1;
  font-size:32px!important;
  font-weight:950;
  letter-spacing:-.7px;
  line-height:1.05;
  text-shadow:0 2px 0 #fff,0 5px 12px color-mix(in srgb,var(--gp-accent) 23%,transparent);
}
#gp-kpi .kpi-sub{
  position:relative;
  z-index:1;
  margin-top:8px;
  color:#475569;
  font-size:10.5px;
  font-weight:800;
  line-height:1.45;
}
@media(max-width:1100px){
  #gp-kpi.k5{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:760px){
  #gpOverviewHeading{padding:12px 15px 12px 49px;font-size:15px}
  #gp-kpi.k5{grid-template-columns:repeat(2,1fr)!important}
  #gp-kpi .kpi{min-height:150px;padding:19px 16px 15px}
  #gp-kpi .kpi-val{font-size:27px!important}
  #gp-kpi .kpi-lbl{font-size:11px}
}
@media(max-width:430px){
  #gp-kpi.k5{grid-template-columns:1fr!important}
  #gp-kpi .kpi{min-height:142px}
}
@media(prefers-reduced-motion:reduce){
  #gp-kpi .kpi,#gp-kpi .kpi-ic{transition:none}
  #gp-kpi .kpi:hover::before{animation:none}
}

/* HOLIDAY SCHEDULE — colorful, readable and audit-friendly */
#pg-holiday{--hs-navy:#172554;--hs-blue:#2563eb;--hs-pink:#db2777;--hs-green:#059669;--hs-red:#dc2626;--hs-purple:#7c3aed}

<style id="assigned-buddy-redesign">
/* Assigned Tasks — Buddy redesign, approved 24 Aug 2569 */
#pg-other-work .ow-buddy-panel{
  overflow:hidden;border:1px solid #7de8d3;border-radius:28px;
  background:linear-gradient(145deg,#f3fffb 0%,#f8f6ff 54%,#fff8f1 100%);
  box-shadow:0 18px 46px rgba(38,54,101,.16),0 2px 0 rgba(255,255,255,.9) inset;
}
#pg-other-work .ow-buddy-head{
  min-height:118px;padding:24px 30px;
  background:linear-gradient(105deg,#087b5c 0%,#08a29b 42%,#3184dc 72%,#7029e6 100%);
  border:0;position:relative;overflow:hidden;
}
#pg-other-work .ow-buddy-head:before,
#pg-other-work .ow-buddy-head:after{content:"";position:absolute;border-radius:50%;pointer-events:none}
#pg-other-work .ow-buddy-head:before{width:190px;height:190px;right:8%;top:-105px;background:#ffffff16}
#pg-other-work .ow-buddy-head:after{width:110px;height:110px;right:-22px;bottom:-64px;background:#f472b633}
#pg-other-work .ow-buddy-head>div{position:relative;z-index:1}
#pg-other-work .ow-buddy-head strong{
  color:#fff;font-size:28px!important;line-height:1.2;font-weight:900;
  letter-spacing:.1px;text-shadow:0 3px 12px rgba(12,35,68,.28);
}
#pg-other-work .ow-buddy-head small{
  display:block;margin-top:10px;color:#ddfff7;font-size:13px!important;
  font-weight:750;letter-spacing:.1px
}
#pg-other-work #owBuddyStatus{
  position:relative;z-index:1;padding:11px 18px;border:1px solid #ffffff38;
  border-radius:999px;background:#ffffff22;color:#fff;font-size:12px;font-weight:900;
  box-shadow:0 8px 22px rgba(45,24,115,.2),0 1px 0 #ffffff30 inset;
}
#pg-other-work .ow-buddy-panel .ow-body{padding:24px!important;background:transparent}
#pg-other-work .ow-buddy-toolbar{
  gap:14px;padding:18px;border:1px solid #6ce0ca;border-radius:20px;
  background:linear-gradient(100deg,#eafff7 0%,#f8fbff 48%,#f5edff 100%);
  box-shadow:0 10px 24px rgba(34,77,99,.09),0 1px 0 #fff inset;
}
#pg-other-work .ow-buddy-toolbar .ow-field label{
  margin-bottom:8px;color:#087762;font-size:12px!important;font-weight:900
}
#pg-other-work .ow-buddy-toolbar select{
  height:50px!important;border:2px solid #79dfd0!important;border-radius:15px!important;
  background:#fff!important;color:#18233a!important;font-size:13px!important;font-weight:800!important;
  box-shadow:0 5px 14px rgba(29,80,101,.07);transition:.22s ease
}
#pg-other-work .ow-buddy-toolbar select:hover,
#pg-other-work .ow-buddy-toolbar select:focus{
  border-color:#6d5ce8!important;box-shadow:0 0 0 4px #7658e817,0 9px 20px rgba(69,57,151,.13);
  transform:translateY(-1px)
}
#pg-other-work .ow-buddy-reset{
  min-height:50px!important;border-radius:15px!important;
  background:linear-gradient(105deg,#099985,#476fe0 58%,#7928dc)!important;
  box-shadow:0 10px 22px rgba(109,40,217,.27)!important;font-size:12px!important;font-weight:900!important;
  transition:.22s ease
}
#pg-other-work .ow-buddy-reset:hover{transform:translateY(-3px) scale(1.02);filter:saturate(1.16)}
#pg-other-work .ow-buddy-panel .ow-scroll{margin-top:22px;border-radius:18px;overflow:auto}
#pg-other-work table.ow-buddy{border-collapse:separate!important;border-spacing:0 10px!important;background:transparent!important}
#pg-other-work .ow-buddy thead th{
  height:54px;padding:0 20px!important;border:0!important;
  background:linear-gradient(100deg,#076d59,#079d91 56%,#1289b4)!important;
  color:#fff!important;font-size:13px!important;font-weight:900!important;text-shadow:0 2px 7px #00504755
}
#pg-other-work .ow-buddy thead th:first-child{border-radius:15px 0 0 15px}
#pg-other-work .ow-buddy thead th:last-child{border-radius:0 15px 15px 0}
#pg-other-work .ow-buddy tbody tr{
  --row1:#edf7ff;--row2:#f4efff;--edge:#3b82f6;--ink:#2556c7;
  filter:drop-shadow(0 7px 8px rgba(34,56,96,.10));transition:.22s ease
}
#pg-other-work .ow-buddy tbody tr:nth-child(2),
#pg-other-work .ow-buddy tbody tr:nth-child(4){--row1:#fff4df;--row2:#fff1ed;--edge:#f59e0b;--ink:#a55c00}
#pg-other-work .ow-buddy tbody tr:nth-child(5),
#pg-other-work .ow-buddy tbody tr:nth-child(6){--row1:#e5fff7;--row2:#eaf4ff;--edge:#10b7a2;--ink:#087e74}
#pg-other-work .ow-buddy tbody tr:nth-child(7),
#pg-other-work .ow-buddy tbody tr:nth-child(8){--row1:#fff0df;--row2:#f6edff;--edge:#e8811d;--ink:#9a5410}
#pg-other-work .ow-buddy tbody tr:hover{transform:translateY(-3px) scale(1.003);filter:drop-shadow(0 12px 13px rgba(39,58,104,.17))}
#pg-other-work .ow-buddy tbody td{
  height:58px;padding:10px 20px!important;border-width:1px 0!important;border-style:solid!important;
  border-color:color-mix(in srgb,var(--edge) 35%,#fff)!important;
  background:linear-gradient(100deg,var(--row1),var(--row2))!important;font-size:14px!important
}
#pg-other-work .ow-buddy tbody td:first-child{border-left:8px solid var(--edge)!important;border-radius:16px 0 0 16px}
#pg-other-work .ow-buddy tbody td:last-child{border-right:1px solid color-mix(in srgb,var(--edge) 35%,#fff)!important;border-radius:0 16px 16px 0}
#pg-other-work .ow-topic{color:var(--ink)!important;font-size:15px!important;font-weight:900!important}
#pg-other-work .ow-owner{
  padding:8px 14px!important;border:1px solid #ffffffaa;border-radius:999px!important;
  background:linear-gradient(135deg,#e5ddff,#d9e9ff)!important;color:#6040ca!important;
  font-size:12px!important;font-weight:900!important;box-shadow:0 5px 12px rgba(90,65,190,.12)
}
#pg-other-work .ow-buddy-pill{
  padding:9px 16px!important;border:1px solid #ffffffc4;border-radius:999px!important;
  background:linear-gradient(135deg,#bff8e5,#9ceecf)!important;color:#07745a!important;
  font-size:12px!important;font-weight:900!important;box-shadow:0 7px 15px rgba(13,148,111,.18)
}
@media(max-width:760px){
  #pg-other-work .ow-buddy-head{min-height:104px;padding:20px}
  #pg-other-work .ow-buddy-head strong{font-size:22px!important}
  #pg-other-work .ow-buddy-panel .ow-body{padding:14px!important}
  #pg-other-work .ow-buddy tbody td{font-size:12px!important;padding:8px 12px!important}
}
</style>
</head>

// รองรับ YYYY-MM-DD / YYYY-MM (แนะนำ, ไม่กำกวม) และ DD/MM/YYYY แบบ fallback (เดา day-first ถ้าไม่ชัดเจน)
function parseDateFlexible(s){
  if(!s&&s!==0) return null;
  s=String(s).trim(); if(!s) return null;
  let m;
  if(m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/)) return{y:+m[1],mo:+m[2],d:+m[3]};
  if(m=s.match(/^(\d{4})[\/-](\d{1,2})$/)) return{y:+m[1],mo:+m[2],d:1};
  if(m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/)){
    let a=+m[1],b=+m[2],y=+m[3];
    if(a>12) return{y,mo:b,d:a};
    if(b>12) return{y,mo:a,d:b};
    return{y,mo:b,d:a}; // สมมุติ dd/mm/yyyy (มาตรฐานไทย) เมื่อกำกวม
  }
  const d=new Date(s); if(!isNaN(d.getTime())) return{y:d.getFullYear(),mo:d.getMonth()+1,d:d.getDate()};
  return null;
}
function normBrand(s){
  if(!s) return null;
  const t=String(s).trim().toLowerCase();
  const b=DATA.brandMeta.find(b=>b.k===t||b.sh.toLowerCase()===t||b.full.toLowerCase()===t||b.lb===String(s).trim());
  return b?b.k:null;
}
function num(v){ const n=parseFloat(String(v).replace(/,/g,'')); return isNaN(n)?0:n; }
// case-insensitive key lookup — รองรับทั้ง seed (camelCase) และหัวคอลัมน์จาก Google Sheets ที่ผู้ใช้พิมพ์เอง (Employee/employee/EMPLOYEE ฯลฯ)
function pick(o,...keys){
  const lower={};Object.keys(o).forEach(k=>lower[k.toLowerCase()]=o[k]);
  for(const k of keys){const v=lower[k.toLowerCase()];if(v!==undefined&&v!=='')return v;}
  return '';
}

/* ── CSV parser (รองรับ quoted field ที่มี comma/newline ภายใน) ── */
function parseCSV(text){
  const out=[]; let row=[],field='',inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){ if(c==='"'){ if(text[i+1]==='"'){field+='"';i++;} else inQ=false; } else field+=c; }
    else{
      if(c==='"') inQ=true;
      else if(c===','){row.push(field);field='';}
      else if(c==='\r'){/*skip*/}
      else if(c==='\n'){row.push(field);out.push(row);row=[];field='';}
      else field+=c;
    }
  }
  if(field.length||row.length){row.push(field);out.push(row);}
  if(!out.length) return [];
  const headers=out[0].map(h=>h.trim());
  return out.slice(1).filter(r=>r.some(v=>v!=='')).map(r=>{const o={};headers.forEach((h,i)=>o[h]=r[i]!==undefined?r[i].trim():'');return o;});
}

/* แยก Spreadsheet ID + gid จากลิงก์ที่ผู้ใช้วาง รองรับหลายรูปแบบ (edit link, ลิงก์ share แบบสั้น, มี/ไม่มี #gid) */
function parseSheetRef(raw){
  if(!raw) return null;
  const s=raw.trim();
  if(/\/spreadsheets\/d\/e\//.test(s)) return {error:'publish-link'};
  const idMatch=s.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
  if(!idMatch) return {error:'no-id'};
  const gidMatch=s.match(/[?&#]gid=(\d+)/);
  return {id:idMatch[1],gid:gidMatch?gidMatch[1]:'0'};
}

/* แปลงค่าเซลล์วันที่แบบ gviz "Date(2026,6,21)" (เดือนเริ่มที่ 0) → 'YYYY-MM-DD' */
function gvizDateToStr(v){
  const m=String(v).match(/^Date\((\d+),(\d+),(\d+)/);
  if(!m) return v;
  const y=+m[1],mo=+m[2]+1,d=+m[3];
  return y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0');
}
/* แปลง table จาก gviz response → array of objects คีย์ตามหัวคอลัมน์ (label) เหมือนผลลัพธ์ parseCSV เดิม */
function gvizTableToRows(table){
  if(!table||!table.cols||!table.rows) return [];
  const headers=table.cols.map((c,i)=>(c.label||c.id||('col'+i)).trim());
  return table.rows.map(r=>{
    const o={};
    headers.forEach((h,i)=>{
      const cell=r.c&&r.c[i];
      if(!cell||cell.v==null){ o[h]=''; return; }
      let v=cell.v;
      if(typeof v==='string'&&v.indexOf('Date(')===0) v=gvizDateToStr(v);
      o[h]=v;
    });
    return o;
  });
}
/* ดึงข้อมูลผ่าน gviz โดยแทรก <script> ชั่วคราว (JSONP) — ไม่ผ่าน fetch/XHR จึงไม่ติด CORS แม้เปิดแบบ file:/// */
function fetchGvizJSONP(id,gid,timeoutMs=12000){
  return new Promise(resolve=>{
    const cbName='__gvizCb_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    let done=false;
    const cleanup=()=>{ try{delete window[cbName];}catch(e){window[cbName]=undefined;} const s=document.getElementById(cbName+'_s'); if(s&&s.parentNode) s.parentNode.removeChild(s); clearTimeout(timer); };
    const timer=setTimeout(()=>{ if(done)return; done=true; cleanup(); resolve({ok:false,reason:'timeout (โหลดนานเกินไป ตรวจสอบสิทธิ์แชร์เป็น "ทุกคนที่มีลิงก์")'}); },timeoutMs);
    window[cbName]=function(resp){
      if(done)return; done=true; cleanup();
      if(!resp||resp.status==='error'){
        const msg=resp&&resp.errors&&resp.errors[0]&&(resp.errors[0].detailed_message||resp.errors[0].message);
        resolve({ok:false,reason:msg||'gviz-error (ตรวจสอบสิทธิ์แชร์/gid)'});
        return;
      }
      resolve({ok:true,table:resp.table});
    };
    const script=document.createElement('script');
    script.id=cbName+'_s';
    script.src='https://docs.google.com/spreadsheets/d/'+encodeURIComponent(id)+'/gviz/tq?gid='+encodeURIComponent(gid)+'&headers=1&tqx=responseHandler:'+cbName;
    script.onerror=()=>{ if(done)return; done=true; cleanup(); resolve({ok:false,reason:'โหลดสคริปต์ไม่สำเร็จ (Sheet ID/gid ผิด หรือยังไม่ได้แชร์เป็น "ทุกคนที่มีลิงก์")'}); };
    document.head.appendChild(script);
  });
}
async function fetchSheet(url){
  if(!url) return {ok:false,reason:'none',rows:null};
  const ref=parseSheetRef(url);
  if(!ref) return {ok:false,reason:'ไม่พบลิงก์',rows:null};
  if(ref.error==='publish-link') return {ok:false,reason:'ลิงก์นี้เป็นลิงก์ Publish-to-web (…/d/e/2PACX-…) ใช้กับวิธีเชื่อมต่อแบบใหม่ไม่ได้ — กรุณาวางลิงก์ Share ปกติแทน เช่น https://docs.google.com/spreadsheets/d/SPREADSHEET_ID/edit#gid=..',rows:null};
  if(ref.error==='no-id') return {ok:false,reason:'รูปแบบลิงก์ไม่ถูกต้อง (ต้องมี /spreadsheets/d/SPREADSHEET_ID/)',rows:null};
  const res=await fetchGvizJSONP(ref.id,ref.gid);
  if(!res.ok) return {ok:false,reason:res.reason,rows:null};
  return {ok:true,rows:gvizTableToRows(res.table)};
}
const SHEET_SPECS={
  sales:[()=>SEED_SALES,normalizeSalesRow],
  targets:[()=>SEED_TARGETS,normalizeTargetRow],
  gp:[()=>SEED_GP,normalizeGPRow],
  redemption:[()=>SEED_REDEMPTION,normalizeRedemptionRow],
  dailyTargetSummary:[()=>SEED_DTS,normalizeDTSRow],
};
async function loadAllData(){
  const cfg=loadSheetConfig();
  const results=await Promise.all(SHEET_KEYS.map(k=>fetchSheet(cfg[k])));
  SHEET_KEYS.forEach((k,i)=>{
    const [getSeed,norm]=SHEET_SPECS[k];
    const r=results[i];
    // SEED_* ใช้โครงสร้างเดียวกับข้อมูลต้นทาง (date/month เป็นข้อความ)
    // จึงต้อง normalize ก่อนกรองปี/เดือนเช่นเดียวกับข้อมูลจาก Google Sheets
    // เดิมคืนค่า seed ตรง ๆ ทำให้ r.y/r.mo เป็น undefined และตัวกรองแสดง 0 ทั้งหน้า
    const normalizedSeed=()=>getSeed().map(norm).filter(Boolean);
    if(!cfg[k]){
      RAW[k]=k==='gp'?reconcileGPRoster(normalizedSeed()):normalizedSeed(); DATA_SOURCE[k]='seed';
      LOAD_STATUS[k]={state:'none',rows:0,detail:'ยังไม่ได้วางลิงก์ — ใช้ข้อมูลตัวอย่าง'};
      return;
    }
    if(!r.ok){
      RAW[k]=k==='gp'?reconcileGPRoster(normalizedSeed()):normalizedSeed(); DATA_SOURCE[k]='seed';
      LOAD_STATUS[k]={state:'error',rows:0,detail:'ดึงข้อมูลไม่สำเร็จ ('+r.reason+') — ใช้ข้อมูลตัวอย่างแทนชั่วคราว'};
      return;
    }
    const rows=(r.rows||[]).map(norm).filter(Boolean);
    if(rows.length){
      RAW[k]=k==='gp'?reconcileGPRoster(rows):rows; DATA_SOURCE[k]='sheet';
      LOAD_STATUS[k]={state:'sheet',rows:rows.length,detail:'เชื่อมต่อสำเร็จ พบ '+rows.length+' แถว'};
    }else{
      RAW[k]=k==='gp'?reconcileGPRoster(normalizedSeed()):normalizedSeed(); DATA_SOURCE[k]='seed';
      LOAD_STATUS[k]={state:'empty',rows:0,detail:'เชื่อมต่อสำเร็จ แต่ไม่พบแถวข้อมูลที่ใช้ได้ (ตรวจหัวคอลัมน์/ชื่อแท็บ/gid) — ใช้ข้อมูลตัวอย่างแทนชั่วคราว'};
    }
  });
}

function getAvailableYears(){
  const s=new Set();
  [...RAW.sales,...RAW.redemption].forEach(r=>s.add(r.y));
  [...RAW.gp,...RAW.targets,...RAW.dailyTargetSummary].forEach(r=>s.add(r.y));
  return[...s].filter(Boolean).sort((a,b)=>b-a);
}
function getAvailableMonths(year){
  const s=new Set();
  [...RAW.sales,...RAW.redemption].filter(r=>r.y===+year).forEach(r=>s.add(r.mo));
  [...RAW.gp,...RAW.targets,...RAW.dailyTargetSummary].filter(r=>r.y===+year).forEach(r=>s.add(r.mo));
  return[...s].filter(Boolean).sort((a,b)=>a-b);
}
function populateYearOptions(){

}
function populateMonthOptions(){
  const el=document.getElementById('fMonth');el.innerHTML='<option value="all">ทุกเดือน (YTD)</option>';

  el.disabled=STATE.year==='all';
  el.value=STATE.month;
}

const ORG_FALLBACK='data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#dbeafe"/><stop offset="1" stop-color="#ede9fe"/></linearGradient></defs><rect width="420" height="420" fill="url(#g)"/><circle cx="210" cy="165" r="72" fill="#94a3b8"/><path d="M72 420c12-102 65-154 138-154s126 52 138 154" fill="#64748b"/></svg>');
let ORG_DATA={},ORG_EDIT_ID=null,ORG_NEW_PHOTO=null;
function orgId(){return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function orgPerson(name,role='Admin',shift='morning',note=''){return{id:orgId(),name,role,shift,status:'active',note,photo:ORG_PHOTOS[name]||ORG_FALLBACK}}
function orgSeed(){
  const monthlyNames={
    1:['แอ๋ม','แพร','เปิ้ล','อีริส','หนึ่ง','ตาล','เกมส์','ป้าย'],
    2:['แอ๋ม','แพร','เปิ้ล','อีริส','หนึ่ง','ตาล','เกมส์','ป้าย'],
    3:['แอ๋ม','แพร','เปิ้ล','อีริส','หนึ่ง','ตาล','เกมส์','ป้าย','อชิ','เกอร์'],
    4:['แอ๋ม','แพร','เปิ้ล','หนึ่ง','ตาล','เกมส์','ป้าย','อชิ','เกอร์'],
    5:['แอ๋ม','แพร','เปิ้ล','หนึ่ง','ตาล','เกมส์','ป้าย','อชิ','เกอร์','เดียร์'],
    6:['แอ๋ม','แพร','เปิ้ล','หนึ่ง','ตาล','ป้าย','อชิ','เกอร์','เดียร์'],
    7:['แอ๋ม','แพร','เปิ้ล','หนึ่ง','ตาล','ป้าย','อชิ','เกอร์','เดียร์'],
    8:['แอ๋ม','แพร','เปิ้ล','หนึ่ง','ป้าย','อชิ','เกอร์','เดียร์','น้ำฝน']
  };
  const out={};
  Object.keys(monthlyNames).forEach(m=>{
    const people=[orgPerson('นุ๊ก','Supervisor','management','Supervisor')];
    monthlyNames[m].forEach((name,i)=>{
      let role=name==='เปิ้ล'?'Lead':'Admin',shift=role==='Lead'?'management':(['หนึ่ง','แอ๋ม'].includes(name)?'wfh':(['เกอร์','เดียร์','น้ำฝน'].includes(name)?'afternoon':'morning'));
      people.push(orgPerson(name,role,shift,role==='Lead'?'Standby กะเช้า/กะบ่าย':shift==='wfh'?'Standby กะเช้า/กะบ่าย':''));
    });
    out['2026-'+String(m).padStart(2,'0')]=people;
  });
  return out;
}
function normalizeOrgData(){
  Object.values(ORG_DATA).forEach(people=>people.forEach(p=>{
    if(p.name==='เปิ้ล'||p.role==='Lead'){p.role='Lead';p.shift='management';p.note='Standby กะเช้า/กะบ่าย'}
    if(p.shift==='wfh')p.note='Standby กะเช้า/กะบ่าย';
  }));
}
function migrateAugust2026Roster(){
  const migrationKey='sa2_admin_org_august_2026_v2';
  try{if(localStorage.getItem(migrationKey))return}catch(e){}
  const augustKey='2026-08',existing=ORG_DATA[augustKey]||[],supervisors=existing.filter(p=>p.role==='Supervisor');
  const supervisor=supervisors[0]||orgPerson('นุ๊ก','Supervisor','management','Supervisor');
  const augustNames=['แอ๋ม','แพร','เปิ้ล','หนึ่ง','ป้าย','อชิ','เกอร์','เดียร์','น้ำฝน'];
  ORG_DATA[augustKey]=[supervisor,...augustNames.map(name=>{
    const old=existing.find(p=>p.name===name);
    const role=name==='เปิ้ล'?'Lead':'Admin';
    const shift=role==='Lead'?'management':(['แอ๋ม','หนึ่ง'].includes(name)?'wfh':(['เกอร์','เดียร์','น้ำฝน'].includes(name)?'afternoon':'morning'));
    return old?{...old,role,shift,note:role==='Lead'?'Standby กะเช้า/กะบ่าย':shift==='wfh'?'Standby กะเช้า/กะบ่าย':''}:orgPerson(name,role,shift,role==='Lead'?'Standby กะเช้า/กะบ่าย':shift==='wfh'?'Standby กะเช้า/กะบ่าย':'');
  })];
  try{localStorage.setItem(migrationKey,'1')}catch(e){}
}
function hydrateOrgPhotos(){
  Object.values(ORG_DATA).forEach(people=>people.forEach(p=>{
    if(!p.photo||p.photo==='__DEFAULT__')p.photo=ORG_PHOTOS[p.name]||ORG_FALLBACK;
  }));
}
function orgDataForStorage(){
  const copy={};
  Object.entries(ORG_DATA).forEach(([key,people])=>{
    copy[key]=people.map(p=>{
      const defaultPhoto=ORG_PHOTOS[p.name]||ORG_FALLBACK;
      return{...p,photo:p.photo===defaultPhoto?'__DEFAULT__':p.photo};
    });
  });
  return copy;
}
function loadOrgData(){
  try{ORG_DATA=JSON.parse(localStorage.getItem(ORG_STORE)||'{}')}catch(e){ORG_DATA={}}
  if(!Object.keys(ORG_DATA).length)ORG_DATA=orgSeed();
  hydrateOrgPhotos();migrateAugust2026Roster();normalizeOrgData();saveOrgData(false);
}
function saveOrgData(showMessage=true){
  try{
    localStorage.setItem(ORG_STORE,JSON.stringify(orgDataForStorage()));
    if(showMessage)showOrgSaveStatus('✓ บันทึกข้อมูลแล้ว',false);
    return true;
  }catch(e){
    showOrgSaveStatus('บันทึกไม่สำเร็จ — พื้นที่จัดเก็บเต็ม',true);
    alert('บันทึกข้อมูลไม่สำเร็จ เนื่องจากพื้นที่จัดเก็บของเบราว์เซอร์เต็ม กรุณาเลือกรูปที่มีขนาดเล็กลง');
    return false;
  }
}
function showOrgSaveStatus(message,isError){
  const el=document.getElementById('orgSaveStatus');if(!el)return;
  el.textContent=message;el.style.color=isError?'#dc2626':'#047857';el.style.opacity='1';
  clearTimeout(showOrgSaveStatus.timer);showOrgSaveStatus.timer=setTimeout(()=>el.style.opacity='.72',2600);
}
function initOrgFilters(){
  loadOrgData();
  const y=document.getElementById('orgYear'),m=document.getElementById('orgMonth');if(!y||y.options.length)return;
  const years=[...new Set(Object.keys(ORG_DATA).map(k=>k.split('-')[0]))].sort().reverse();if(!years.includes('2026'))years.push('2026');
  y.innerHTML=years.map(v=>`<option value="${v}" ${v==='2026'?'selected':''}>พ.ศ. ${Number(v)+543}</option>`).join('');
  m.innerHTML=ORG_MONTHS.map((v,i)=>`<option value="${String(i+1).padStart(2,'0')}" ${i===7?'selected':''}>${v}</option>`).join('');
}
function orgKey(){return document.getElementById('orgYear').value+'-'+document.getElementById('orgMonth').value}
function currentOrgPeople(){
  const key=orgKey();
  if(!ORG_DATA[key]){
    const keys=Object.keys(ORG_DATA).sort(),previous=keys.filter(k=>k<key).pop()||keys[keys.length-1];
    ORG_DATA[key]=(ORG_DATA[previous]||[]).map(p=>({...p,id:orgId()}));saveOrgData();
  }
  return ORG_DATA[key];
}
function escOrg(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function orgCard(p,executive=false){
  const displayName=p.role==='Lead'?`${p.name}(Lead)`:p.name;
  const displayRole=p.role==='Supervisor'?'Supervisor':p.role==='Lead'?(p.note||'Standby กะเช้า/กะบ่าย'):`${p.role}${p.note?' · '+p.note:''}`;
  return `<article class="person-card${executive?' executive':''}"><button class="person-edit" title="แก้ไขข้อมูล" onclick="openOrgEditor('${p.id}')">✎</button><img class="person-photo" src="${p.photo||ORG_FALLBACK}" alt="${escOrg(p.name)}"><div class="person-info"><div class="person-name">${escOrg(displayName)}</div><div class="person-role">${escOrg(displayRole)}</div></div></article>`;
}
function renderAdminOrg(){
  if(!document.getElementById('orgYear'))return;if(!document.getElementById('orgYear').options.length)initOrgFilters();
  const people=currentOrgPeople().filter(p=>p.status!=='inactive'),sup=people.filter(p=>p.role==='Supervisor'),lead=people.filter(p=>p.role==='Lead'),admins=people.filter(p=>p.role==='Admin');
  document.getElementById('orgSupervisor').innerHTML=sup.length?sup.map(p=>orgCard(p,true)).join(''):'<div class="org-empty">ยังไม่มี Supervisor</div>';
  document.getElementById('orgLead').innerHTML=lead.length?lead.map(p=>orgCard(p,true)).join(''):'<div class="org-empty">ยังไม่มี Lead</div>';
  const teams=[['morning','☀️ กะเช้า'],['afternoon','🌙 กะบ่าย'],['wfh','🏠 WFH']];
  document.getElementById('orgShiftTeams').innerHTML=teams.map(([key,label])=>{const a=admins.filter(p=>p.shift===key);return`<div class="org-team ${key}"><div class="org-team-head">${label}<span>${a.length} คน</span></div><div class="org-members">${a.length?a.map(p=>orgCard(p)).join(''):'<div class="org-empty">ยังไม่มีรายชื่อ</div>'}</div></div>`}).join('');
  document.getElementById('orgSummary').innerHTML=`<div class="org-pill"><b>${sup.length}</b><span>Supervisor</span></div><div class="org-pill"><b>${lead.length}</b><span>Lead</span></div><div class="org-pill"><b>${admins.length}</b><span>Admin</span></div><div class="org-pill"><b>${admins.filter(p=>p.shift==='wfh').length}</b><span>WFH</span></div><div class="org-pill"><b>${people.length}</b><span>พนักงานทั้งหมด</span></div>`;
  const key=orgKey(),month=ORG_MONTHS[Number(key.slice(5))-1],year=Number(key.slice(0,4))+543;
  document.getElementById('orgRosterTitle').textContent=`📋 รายชื่อ Admin ประจำเดือน${month} ${year}`;
  document.getElementById('orgRoster').innerHTML=people.filter(p=>p.role!=='Supervisor').map(p=>`<span>${escOrg(p.name)}${p.role==='Lead'?' · Lead Standby กะเช้า/กะบ่าย':p.shift==='wfh'?' · WFH Standby กะเช้า/กะบ่าย':''}</span>`).join('')||'<span>ยังไม่มีรายชื่อ</span>';
}

/* ══════ EMPLOYEE DAILY PERFORMANCE ══════ */
const ED_COLORS=['#7c3aed','#0891b2','#059669','#db2777','#f97316','#4f46e5','#0d9488','#d97706','#e11d48','#2563eb'];
function initEmployeeDailyFilters(){
  const y=document.getElementById('edYear'),m=document.getElementById('edMonth');if(!y||!m)return;
  const years=[...new Set(Object.values(EMPLOYEE_DAILY_REPORTS).map(r=>r.year))].sort((a,b)=>b-a);
  const currentY=Number(y.value)||years[0];
  y.innerHTML=years.map(v=>`<option value="${v}">${v+543}</option>`).join('');
  y.value=String(years.includes(currentY)?currentY:years[0]);
  const months=Object.values(EMPLOYEE_DAILY_REPORTS).filter(r=>r.year===Number(y.value)).sort((a,b)=>b.month-a.month);
  const currentM=Number(m.value)||months[0].month;
  m.innerHTML=months.map(r=>`<option value="${r.month}">${r.label.replace(' '+(r.year+543),'')}</option>`).join('');
  m.value=String(months.some(r=>r.month===currentM)?currentM:months[0].month);
}
function edReport(){
  initEmployeeDailyFilters();
  const y=Number(document.getElementById('edYear').value),m=Number(document.getElementById('edMonth').value);
  return EMPLOYEE_DAILY_REPORTS[`${y}-${String(m).padStart(2,'0')}`];
}
function resetEmployeeDaily(){document.getElementById('edSearch').value='all';document.getElementById('edSort').value='sales';renderEmployeeDaily()}
function selectEmployeeDaily(name){document.getElementById('edSearch').value=name;renderEmployeeDaily();document.getElementById('edPeople').scrollIntoView({behavior:'smooth',block:'center'})}
function renderEmployeeDaily(){
  const r=edReport();if(!r)return;
  const employeeSelect=document.getElementById('edSearch');
  const selectedEmployee=employeeSelect.value||'all';
  employeeSelect.innerHTML='<option value="all">พนักงานทั้งหมด</option>'+r.employees.map(e=>`<option value="${e.name}">${e.name}</option>`).join('');
  employeeSelect.value=r.employees.some(e=>e.name===selectedEmployee)?selectedEmployee:'all';
  document.getElementById('edPeriod').textContent=`รอบรายงาน ${r.range} · เป้า ${fmtN(r.orderTarget)} ออเดอร์ และ ${fmtN(r.revenueTarget)} บาท/วัน`;
  const activeDays=r.employees.reduce((s,e)=>s+e.orderPass+e.orderFail,0);
  const avgOrders=Math.round(r.totalOrders/r.employees.length),avgSales=Math.round(r.totalSales/r.employees.length);
  const kpis=[
    ['📦','ออเดอร์รวม',fmtN(r.totalOrders),`เฉลี่ย ${fmtN(avgOrders)} ออเดอร์/คน`,'#4f46e5'],
    ['💰','ยอดขายรวม',fmtB(r.totalSales),`เฉลี่ย ${fmtB(avgSales)}/คน`,'#db2777'],
    ['✅','ผ่านเป้าออเดอร์',fmtPct(r.orderPassPct,2),`เป้า ${fmtN(r.orderTarget)} ออเดอร์/วัน`,'#0891b2'],
    ['🌟','ผ่านเป้ายอดขาย',fmtPct(r.salesPassPct,2),`เป้า ${fmtB(r.revenueTarget)}/วัน`,'#059669'],
    ['👥','ทีมงาน',`${r.employees.length} คน`,`รวม ${Math.max(...r.employees.map(e=>e.orderPass+e.orderFail))} วันทำงาน`,'#f97316']
  ];
  document.getElementById('edKpis').innerHTML=kpis.map(k=>`<div class="ed-kpi" style="--ec:${k[4]}"><div class="ed-kpi-ic">${k[0]}</div><span>${k[1]}</span><b>${k[2]}</b><small>${k[3]}</small></div>`).join('');
  const topSales=[...r.employees].sort((a,b)=>b.sales-a.sales)[0],topOrder=[...r.employees].sort((a,b)=>b.orders-a.orders)[0];
  const weakest=[...r.employees].sort((a,b)=>(a.salesPass/(a.salesPass+a.salesFail))-(b.salesPass/(b.salesPass+b.salesFail)))[0];
  document.getElementById('edHighlights').innerHTML=`<div class="ed-winner"><strong>🏆 ผลงานเด่นประจำเดือน</strong><p><span class="big">${topSales.name}</span> ทำยอดขายสูงสุด ${fmtB(topSales.sales)} · ${topOrder.name} ทำออเดอร์สูงสุด ${fmtN(topOrder.orders)} ออเดอร์</p></div><div class="ed-focus"><strong>🎯 Executive Focus</strong><p><span class="big">${weakest.name}</span> มีอัตราผ่านเป้ายอดขายต่ำสุด ${fmtPct(weakest.salesPass/(weakest.salesPass+weakest.salesFail)*100,1)} ควรได้รับ Coaching เป็นลำดับแรก</p></div>`;
  const selectedName=document.getElementById('edSearch').value||'all',sort=document.getElementById('edSort').value;
  let rows=r.employees.filter(e=>selectedName==='all'||e.name===selectedName);
  const sorters={sales:(a,b)=>b.sales-a.sales,orders:(a,b)=>b.orders-a.orders,salesPass:(a,b)=>b.salesPass-a.salesPass,orderPass:(a,b)=>b.orderPass-a.orderPass,name:(a,b)=>a.name.localeCompare(b.name)};
  rows=[...rows].sort(sorters[sort]||sorters.sales);
  document.getElementById('edPeople').innerHTML=rows.length?rows.map((e,i)=>{
    const op=e.orderPass/(e.orderPass+e.orderFail)*100,sp=e.salesPass/(e.salesPass+e.salesFail)*100,c=ED_COLORS[i%ED_COLORS.length];
    return `<article class="ed-person" style="--ec:${c}" onclick="selectEmployeeDaily('${e.name}')"><span class="ed-person-rank">#${i+1}</span><div class="ed-person-name">${e.name}</div><div class="ed-person-sales">${fmtB(e.sales)}</div><div class="ed-person-orders">📦 ${fmtN(e.orders)} ออเดอร์</div><div class="ed-pass-row"><div class="ed-pass order"><span>ผ่านออเดอร์</span><b>${fmtPct(op,1)}</b></div><div class="ed-pass"><span>ผ่านยอดขาย</span><b>${fmtPct(sp,1)}</b></div></div></article>`
  }).join(''):'<div class="ed-card ed-empty">ไม่พบชื่อพนักงานตามคำค้นหา</div>';
  document.getElementById('edTbody').innerHTML=rows.length?rows.map((e,i)=>{
    const op=e.orderPass/(e.orderPass+e.orderFail)*100,sp=e.salesPass/(e.salesPass+e.salesFail)*100;
    return `<tr><td><span class="ed-rank ${i<3?'top':''}">${i<3?MED[i]:i+1}</span></td><td class="name">${e.name}</td><td class="orders">${fmtN(e.orders)}</td><td class="sales">${fmtB(e.sales)}</td><td><span class="ed-pill pass">${e.orderPass} วัน</span></td><td><span class="ed-pill fail">${e.orderFail} วัน</span></td><td><span class="ed-pill pass">${e.salesPass} วัน</span></td><td><span class="ed-pill fail">${e.salesFail} วัน</span></td><td>${fmtPct(op,1)}</td><td>${fmtPct(sp,1)}</td></tr>`
  }).join(''):'<tr><td class="ed-empty" colspan="10">ไม่พบข้อมูลตามตัวกรอง</td></tr>';
  const labels=rows.map(e=>e.name),colors=rows.map((_,i)=>ED_COLORS[i%ED_COLORS.length]);
  mkChart('edPerformanceChart',{data:{labels,datasets:[{type:'bar',label:'ยอดขาย (บาท)',data:rows.map(e=>e.sales),backgroundColor:colors.map(c=>c+'d9'),borderColor:colors,borderWidth:1,borderRadius:8,yAxisID:'y'},{type:'line',label:'ออเดอร์',data:rows.map(e=>e.orders),borderColor:'#f59e0b',backgroundColor:'#f59e0b',pointBackgroundColor:'#fff',pointBorderColor:'#f59e0b',pointBorderWidth:3,pointRadius:5,tension:.3,yAxisID:'y1'}]},options:{responsive:true,interaction:{mode:'index',intersect:false},plugins:{legend:{labels:{usePointStyle:true,font:{weight:'bold'}}}},scales:{x:{grid:{display:false},ticks:{font:{weight:'bold'}}},y:{beginAtZero:true,grid:{color:GR},ticks:{callback:v=>'฿'+(v/1000)+'K'}},y1:{beginAtZero:true,position:'right',grid:{drawOnChartArea:false}}}}});
  mkChart('edPassChart',{type:'bar',data:{labels,datasets:[{label:'ผ่านออเดอร์ %',data:rows.map(e=>e.orderPass/(e.orderPass+e.orderFail)*100),backgroundColor:'#6366f1d9',borderRadius:6},{label:'ผ่านยอดขาย %',data:rows.map(e=>e.salesPass/(e.salesPass+e.salesFail)*100),backgroundColor:'#10b981d9',borderRadius:6}]},options:{indexAxis:'y',responsive:true,plugins:{legend:{labels:{usePointStyle:true,font:{weight:'bold'}}}},scales:{x:{min:0,max:100,grid:{color:GR},ticks:{callback:v=>v+'%'}},y:{grid:{display:false},ticks:{font:{weight:'bold'}}}}}});
}
function openOrgEditor(id){
  const people=currentOrgPeople(),p=id?people.find(x=>x.id===id):null;ORG_EDIT_ID=p?p.id:null;ORG_NEW_PHOTO=p?p.photo:ORG_FALLBACK;
  document.getElementById('orgEditorTitle').textContent=p?'แก้ไขข้อมูลพนักงาน':'เพิ่มพนักงาน Admin';
  document.getElementById('orgEditName').value=p?p.name:'';document.getElementById('orgEditRole').value=p?p.role:'Admin';document.getElementById('orgEditShift').value=p?p.shift:'morning';document.getElementById('orgEditStatus').value=p?p.status:'active';document.getElementById('orgEditNote').value=p?p.note:'';
  document.getElementById('orgPhotoPreview').src=ORG_NEW_PHOTO;document.getElementById('orgDeleteBtn').style.visibility=p?'visible':'hidden';document.getElementById('orgEditPhoto').value='';document.getElementById('orgEditor').classList.add('open');
}
function closeOrgEditor(){document.getElementById('orgEditor').classList.remove('open')}
function previewOrgPhoto(input){
  const f=input.files&&input.files[0];if(!f)return;
  if(!f.type.startsWith('image/')){alert('กรุณาเลือกไฟล์รูปภาพ');input.value='';return}
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const max=640,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');
      canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
      ORG_NEW_PHOTO=canvas.toDataURL('image/webp',.82);
      document.getElementById('orgPhotoPreview').src=ORG_NEW_PHOTO;
    };
    img.onerror=()=>alert('ไม่สามารถอ่านไฟล์รูปนี้ได้');
    img.src=e.target.result;
  };
  reader.readAsDataURL(f);
}
function clearOrgPhoto(){ORG_NEW_PHOTO=ORG_FALLBACK;document.getElementById('orgPhotoPreview').src=ORG_FALLBACK;document.getElementById('orgEditPhoto').value=''}
function saveOrgPerson(){
  const name=document.getElementById('orgEditName').value.trim();if(!name){alert('กรุณากรอกชื่อพนักงาน');return}
  const people=currentOrgPeople(),values={name,role:document.getElementById('orgEditRole').value,shift:document.getElementById('orgEditShift').value,status:document.getElementById('orgEditStatus').value,note:document.getElementById('orgEditNote').value.trim(),photo:ORG_NEW_PHOTO||ORG_FALLBACK};
  if(ORG_EDIT_ID){const i=people.findIndex(p=>p.id===ORG_EDIT_ID);if(i>=0)people[i]={...people[i],...values}}else people.push({id:orgId(),...values});
  if(saveOrgData()){closeOrgEditor();renderAdminOrg()}
}
function deleteOrgPerson(){if(!ORG_EDIT_ID||!confirm('ยืนยันลบรายชื่อนี้ออกจากเดือนที่เลือก?'))return;const before=ORG_DATA[orgKey()];ORG_DATA[orgKey()]=currentOrgPeople().filter(p=>p.id!==ORG_EDIT_ID);if(saveOrgData()){closeOrgEditor();renderAdminOrg()}else ORG_DATA[orgKey()]=before}
function copyOrgRoster(){const source=currentOrgPeople(),month=prompt('กรอกเลขเดือนปลายทาง 1–12');if(month==null)return;const n=Number(month);if(n<1||n>12){alert('กรุณากรอกเดือน 1–12');return}const key=document.getElementById('orgYear').value+'-'+String(n).padStart(2,'0');ORG_DATA[key]=source.map(p=>({...p,id:orgId()}));saveOrgData();document.getElementById('orgMonth').value=String(n).padStart(2,'0');renderAdminOrg()}

function initOtherWorkFilters(){
  const el=document.getElementById('owOwner');
  if(el&&el.options.length===1)[...new Set(OTHER_WORK_ROWS.map(r=>r[0]))].sort().forEach(n=>el.insertAdjacentHTML('beforeend',`<option>${n}</option>`));
  const sa=document.getElementById('owBuddySA'),buddy=document.getElementById('owBuddyName'),topic=document.getElementById('owBuddyTopic');
  if(sa&&sa.options.length===1)[...new Set(OTHER_BUDDIES.map(r=>r[1]))].sort().forEach(n=>sa.insertAdjacentHTML('beforeend',`<option>${n}</option>`));
  if(buddy&&buddy.options.length===1)[...new Set(OTHER_BUDDIES.map(r=>r[2]))].sort().forEach(n=>buddy.insertAdjacentHTML('beforeend',`<option>${n}</option>`));

}

/* ══════════════════════════════════════════════════════════════════
   SECTION 5 — COMPUTE LAYER (กรองตาม Year/Month/Brand/Employee ก่อนรวมทุกครั้ง)

function computeGP(){
  const brands=STATE.brand==='all'?DATA.brandMeta:[brandOf(STATE.brand)];
  const periodRows=RAW.gp.filter(r=>inPeriod(r.y,r.mo));
  const staffAll=[...new Set(periodRows.map(r=>r.employee))].filter(Boolean).sort();
  const staff=STATE.empB==='all'?staffAll:staffAll.filter(n=>n===STATE.empB);
  const rows=staff.map(name=>{
    const vals=brands.map(b=>{
      const match=periodRows.filter(r=>r.employee===name&&r.brand===b.k);
      if(!match.length) return{b,v:null,t:match[0]?match[0].thresholdPercent:null,pass:false};
      const v=avg(match.map(r=>r.gpPercent)); const t=avg(match.map(r=>r.thresholdPercent));
      return{b,v,t,pass:v>=t};
    });
    const known=vals.filter(v=>v.v!=null);
    const passCount=known.filter(v=>v.pass).length;
    const avgGP=known.length?avg(known.map(v=>v.v)):null;
    const ratio=known.length?passCount/known.length:0;
    return{name,vals,passCount,knownCount:known.length,avgGP,badge:!known.length?'— ไม่มีข้อมูล':ratio>=0.75?'🌟 ดีมาก':ratio>=0.5?'✅ พอใช้':'⚠️ ต้องปรับ'};
  });
  const brandStats=brands.map(b=>{
    const known=rows.map(r=>r.vals.find(v=>v.b.k===b.k)).filter(v=>v.v!=null);
    const passCount=known.filter(v=>v.pass).length;
    return{b,passCount,total:known.length,passPct:known.length?passCount/known.length*100:0};
  });
  const totalCells=brandStats.reduce((a,s)=>a+s.total,0);
  const totalPass=brandStats.reduce((a,s)=>a+s.passCount,0);
  return{brands,rows,brandStats,overallPassPct:totalCells?totalPass/totalCells*100:0,totalPass,totalCells};
}

function computeSO(){
  const brands=STATE.brand==='all'?DATA.brandMeta:[brandOf(STATE.brand)];
  const brandKeys=new Set(brands.map(b=>b.k));
  const periodNamed=RAW.sales.filter(r=>r.employee&&brandKeys.has(r.brand)&&inPeriod(r.y,r.mo));
  // แสดงเฉพาะพนักงานที่มีข้อมูลจริงในปี/เดือน/แบรนด์ที่เลือก
  // เพื่อไม่ให้ชื่อจากเดือนอื่นติดมาเป็นแถวหรือแท่งยอด 0
  const activeStaff=[...new Set(periodNamed.map(r=>r.employee))].sort();
  const staff=STATE.empA==='all'?activeStaff:activeStaff.filter(n=>n===STATE.empA);
  const rows=staff.map(name=>{
    const rs=periodNamed.filter(r=>r.employee===name);
    let ord=0,rev=0;const byBrand={};brands.forEach(b=>byBrand[b.k]=0);
    rs.forEach(r=>{ord+=r.orders;rev+=r.revenue;byBrand[r.brand]+=r.revenue;});
    return{name,ord,rev,avgOrder:ord?Math.round(rev/ord):0,byBrand};
  }).filter(r=>r.ord>=SO_VIEW.minOrders&&r.rev>=SO_VIEW.minRevenue);
  const sorters={revenue:(a,b)=>b.rev-a.rev,orders:(a,b)=>b.ord-a.ord,average:(a,b)=>b.avgOrder-a.avgOrder,name:(a,b)=>a.name.localeCompare(b.name)};
  const sortRev=[...rows].sort(sorters[SO_VIEW.sort]||sorters.revenue);
  const totalOrd=sum(rows.map(r=>r.ord)),totalRev=sum(rows.map(r=>r.rev));
  const visibleNames=new Set(rows.map(r=>r.name));
  const brandTotals=brands.map(b=>{
    const rs=periodNamed.filter(r=>r.brand===b.k&&visibleNames.has(r.employee));
    const o=sum(rs.map(r=>r.orders)),r=sum(rs.map(r=>r.revenue));
    return{b,o,r,avg:o?Math.round(r/o):0,pct:totalRev?r/totalRev*100:0};
  });
  const topRevenue=[...rows].sort((a,b)=>b.rev-a.rev)[0]||null;
  return{brands,rows,sortRev,totalOrd,totalRev,avgOrderValue:totalOrd?Math.round(totalRev/totalOrd):0,brandTotals,topRevenue};
}

// เป้ารายวันรายพนักงาน: คำนวณจริงจาก Sales รายวัน + Targets ถ้ามีข้อมูลรายวันเพียงพอ (≥5 วันจริงต่อคนในช่วงที่เลือก)
// ถ้าไม่พอ (เช่น ก.ค. 2569 ที่มีแต่ยอดสะสม) จะ fallback ไปใช้ DailyTargetSummary ของเดือนนั้นแทนอัตโนมัติ
function employeeDailyTarget(name,y,mo){
  const rows=RAW.targets.filter(r=>r.type==='employee'&&r.code===name&&(r.y<y||(r.y===y&&r.mo<=mo)));
  if(!rows.length) return null;
  rows.sort((a,b)=>(a.y*12+a.mo)-(b.y*12+b.mo));
  return rows[rows.length-1];
}
function computeDaily(){
  const staffAll=[...new Set([...RAW.sales.filter(r=>r.employee).map(r=>r.employee),...RAW.dailyTargetSummary.map(r=>r.employee)])].sort();
  const staff=STATE.empA==='all'?staffAll:staffAll.filter(n=>n===STATE.empA);
  const rows=staff.map(name=>{
    const namedDaily=RAW.sales.filter(r=>r.employee===name&&inPeriod(r.y,r.mo));
    const distinctDates=new Set(namedDaily.map(r=>`${r.y}-${r.mo}-${r.d}`));
    let po=0,fo=0,pr=0,fr=0,ao=0,ar=0,rev=0,ord=0,mode='none';
    if(distinctDates.size>=5){
      mode='daily';
      const byDate={};
      namedDaily.forEach(r=>{const k=`${r.y}-${r.mo}-${r.d}`;byDate[k]=byDate[k]||{orders:0,revenue:0,y:r.y,mo:r.mo};byDate[k].orders+=r.orders;byDate[k].revenue+=r.revenue;});
      Object.values(byDate).forEach(day=>{
        const tgt=employeeDailyTarget(name,day.y,day.mo);
        rev+=day.revenue;ord+=day.orders;
        if(tgt&&tgt.dailyOrderTarget>0){ao++; day.orders>=tgt.dailyOrderTarget?po++:fo++;}
        if(tgt&&tgt.dailyRevenueTarget>0){ar++; day.revenue>=tgt.dailyRevenueTarget?pr++:fr++;}
      });
    } else {
      const summary=RAW.dailyTargetSummary.filter(s=>s.employee===name&&inPeriod(s.y,s.mo));
      if(summary.length){
        mode='summary';
        po=sum(summary.map(s=>s.passOrderDays));fo=sum(summary.map(s=>s.failOrderDays));
        pr=sum(summary.map(s=>s.passRevenueDays));fr=sum(summary.map(s=>s.failRevenueDays));
        ao=po+fo;ar=pr+fr;
        rev=sum(namedDaily.map(r=>r.revenue));ord=sum(namedDaily.map(r=>r.orders));
        if(!rev&&!ord){ // ถ้าไม่มี sales row เลยในช่วงนี้ (เช่นดูปีอื่น) ใช้ 0
        }
      }
    }
    const totalDays=mode==='summary'?sum(RAW.dailyTargetSummary.filter(s=>s.employee===name&&inPeriod(s.y,s.mo)).map(s=>s.totalDays)):distinctDates.size;
    const oo=Math.max(0,totalDays-ao),orOff=Math.max(0,totalDays-ar);
    return{n:name,mode,rev,ord,po,fo,pr,fr,ao,ar,oo,or:orOff,totalDays,pco:ao?po/ao*100:0,pcr:ar?pr/ar*100:0,avr:ao?Math.round(rev/ao):0,avo:ao?(ord/ao):0};
  }).filter(r=>r.mode!=='none');
  const totalOrd=sum(rows.map(r=>r.ord)),totalRev=sum(rows.map(r=>r.rev));
  const totalPO=sum(rows.map(r=>r.po)),totalAO=sum(rows.map(r=>r.ao));
  const totalPR=sum(rows.map(r=>r.pr)),totalAR=sum(rows.map(r=>r.ar));
  const sortByRev=[...rows].sort((a,b)=>b.rev-a.rev);
  return{rows,totalOrd,totalRev,passOrderPct:totalAO?totalPO/totalAO*100:0,passRevPct:totalAR?totalPR/totalAR*100:0,topRevenue:sortByRev[0]||null,worstOrderPct:rows.length?[...rows].sort((a,b)=>a.pco-b.pco)[0]:null};
}

// รวมยอดขายรายวันแยกแบรนด์จาก Sales: ถ้าวันนั้น+แบรนด์นั้นมีแถว "ยอดรวมทีม" (employee ว่าง) ให้ใช้ค่านั้น (กันนับซ้ำ)
// ถ้าไม่มี ให้รวมจากแถวรายพนักงานแทน (เผื่อเดือนถัดไปที่กรอกเฉพาะรายพนักงาน)
function brandDailySeries(brandKey,y,mo){
  const rows=RAW.sales.filter(r=>r.brand===brandKey&&inPeriod(y===undefined?r.y:y,mo===undefined?r.mo:mo));
  const byDate={};
  rows.forEach(r=>{const k=`${r.y}-${String(r.mo).padStart(2,'0')}-${String(r.d).padStart(2,'0')}`;byDate[k]=byDate[k]||{team:0,named:0,hasTeam:false,y:r.y,mo:r.mo,d:r.d};
    if(r.employee){byDate[k].named+=r.revenue;} else {byDate[k].team+=r.revenue;byDate[k].hasTeam=true;}
  });
  return Object.keys(byDate).sort().map(k=>{const b=byDate[k];return{date:k,y:b.y,mo:b.mo,d:b.d,revenue:b.hasTeam?b.team:b.named};});
}
function computeMonthly(){
  const brands=STATE.brand==='all'?DATA.brandMeta:[brandOf(STATE.brand)];
  const perBrandSeries=brands.map(b=>({b,series:brandDailySeries(b.k)}));
  const dateSet=[...new Set(perBrandSeries.flatMap(x=>x.series.map(s=>s.date)))].sort();
  const combinedSeries=dateSet.map(dt=>sum(perBrandSeries.map(x=>{const f=x.series.find(s=>s.date===dt);return f?f.revenue:0;})));
  const N=dateSet.length;
  const monthsInScope=[...new Set(dateSet.map(dt=>dt.slice(0,7)))];
  const targetForMonth=(brandKey,ym)=>{const[y,mo]=ym.split('-').map(Number);const r=RAW.targets.filter(t=>t.type==='brand'&&t.code===brandKey&&t.y===y&&t.mo===mo);return r.length?avg(r.map(x=>x.dailyRevenueTarget)):0;};
  const combinedTargetPerDate=dateSet.map(dt=>sum(brands.map(b=>targetForMonth(b.k,dt.slice(0,7)))));
  const combinedTarget=N?avg(combinedTargetPerDate):0;
  const totalMonthTarget=sum(monthsInScope.map(ym=>{const[,mo]=ym.split('-').map(Number);const daysInM=new Date(+ym.slice(0,4),mo,0).getDate();return sum(brands.map(b=>targetForMonth(b.k,ym)))*daysInM;}));
  const cumulativeActual=sum(combinedSeries);
  const daysInScopeMonth=monthsInScope.length===1?new Date(+monthsInScope[0].slice(0,4),+monthsInScope[0].slice(5,7),0).getDate():null;
  const remainingDays=daysInScopeMonth!=null?Math.max(0,daysInScopeMonth-N):0;
  const gap=totalMonthTarget-cumulativeActual;
  const achievedPct=totalMonthTarget?cumulativeActual/totalMonthTarget*100:0;
  const avgPerDay=N?cumulativeActual/N:0;
  const requiredDailyRemaining=remainingDays>0?gap/remainingDays:0;
  const requiredIncreasePct=avgPerDay>0?(requiredDailyRemaining-avgPerDay)/avgPerDay*100:0;
  const isSingleMonth=monthsInScope.length===1;
  const brandCards=brands.map(b=>{
    const series=brandDailySeries(b.k);const tr=sum(series.map(s=>s.revenue));
    const ym=monthsInScope[0];const dailyT=isSingleMonth?targetForMonth(b.k,ym):avg(monthsInScope.map(m=>targetForMonth(b.k,m)));
    const tt=isSingleMonth?dailyT*(daysInScopeMonth||30):dailyT*series.length;
    const ps=isSingleMonth?series.filter(s=>s.revenue>=dailyT).length:0;
    return{b,tr,tt,ps,n:series.length,pct:tt?tr/tt*100:0};
  });
  const wow=weekOverWeek(combinedSeries);
  // เทรนด์รายเดือน (สำหรับกราฟเปรียบเทียบแต่ละเดือน / YTD) — รวมทุกเดือนที่มีข้อมูล ไม่ผูกกับ brand filter ของหน้านี้ (ใช้แบรนด์ที่เลือกจริง)
  const monthlyBuckets={};
  perBrandSeries.forEach(x=>x.series.forEach(s=>{monthlyBuckets[s.date.slice(0,7)]=(monthlyBuckets[s.date.slice(0,7)]||0)+s.revenue;}));
  const monthlyTrend=Object.keys(monthlyBuckets).sort().map(ym=>({ym,revenue:monthlyBuckets[ym]}));
  return{brands,N,isSingleMonth,scopeMonth:isSingleMonth?monthsInScope[0]:null,daysInScopeMonth,combinedTarget,combinedSeries,dateSet,totalMonthTarget,cumulativeActual,remainingDays,gap,achievedPct,avgPerDay,requiredDailyRemaining,requiredIncreasePct,brandCards,wow,monthlyTrend};
}
function weekOverWeek(series){
  if(series.length<8)return null;
  const last=series.slice(-7),prevLen=Math.min(7,series.length-7),prev=series.slice(-7-prevLen,-7);
  if(!prev.length)return null;
  const a=avg(last),p=avg(prev);
  return{lastAvg:a,prevAvg:p,pct:p?((a-p)/p*100):0};
}
// อันดับแบรนด์ตาม % บรรลุเป้า — ใช้ช่วงเวลาที่เลือกอยู่ (Year/Month) เสมอ ไม่ผูกกับ brand-filter (สำหรับ Executive/Insight)
function brandAchievementRanking(){
  return DATA.brandMeta.map(b=>{
    const series=brandDailySeries(b.k);const tr=sum(series.map(s=>s.revenue));
    const months=[...new Set(series.map(s=>s.date.slice(0,7)))];
    const tt=sum(months.map(ym=>{const[y,mo]=ym.split('-').map(Number);const r=RAW.targets.filter(t=>t.type==='brand'&&t.code===b.k&&t.y===y&&t.mo===mo);const dailyT=r.length?avg(r.map(x=>x.dailyRevenueTarget)):0;const daysInM=new Date(y,mo,0).getDate();return dailyT*daysInM;}));
    return{b,tr,tt,pct:tt?tr/tt*100:0};
  }).sort((a,b)=>b.pct-a.pct);
}

const REDEMPTION_PERIOD={year:'2026',month:'8'};
const REDEMPTION_FILTER={brand:'all',product:'all',employee:'all'};
function redemptionInPeriod(r){
  return +r.reportY===+REDEMPTION_PERIOD.year&&+r.reportMo===+REDEMPTION_PERIOD.month;
}
function resetRedemptionDetailFilters(){REDEMPTION_FILTER.brand='all';REDEMPTION_FILTER.product='all';REDEMPTION_FILTER.employee='all'}
function setRedemptionYear(v){REDEMPTION_PERIOD.year=String(v);const months=[...new Set(RAW.redemption.filter(r=>+r.reportY===+v).map(r=>r.reportMo))].sort((a,b)=>a-b);if(!months.includes(+REDEMPTION_PERIOD.month))REDEMPTION_PERIOD.month=String(months[months.length-1]||8);resetRedemptionDetailFilters();renderRedemption();renderAugustRedemptionDaily()}
function setRedemptionMonth(v){REDEMPTION_PERIOD.month=String(v);resetRedemptionDetailFilters();renderRedemption();renderAugustRedemptionDaily()}
function setRedemptionBrand(v){REDEMPTION_FILTER.brand=String(v);renderRedemption();renderAugustRedemptionDaily()}
function setRedemptionProduct(v){REDEMPTION_FILTER.product=String(v);renderRedemption();renderAugustRedemptionDaily()}
function setRedemptionEmployee(v){REDEMPTION_FILTER.employee=String(v);renderRedemption();renderAugustRedemptionDaily()}
function computeRedemption(){
  const basePeriodRows=RAW.redemption.filter(redemptionInPeriod);
  const allNames=[...new Set(basePeriodRows.map(r=>r.employee))].filter(Boolean).sort((a,b)=>a.localeCompare(b,'th'));
  const names=REDEMPTION_FILTER.employee==='all'?allNames:allNames.filter(n=>n===REDEMPTION_FILTER.employee);
  const periodRows=basePeriodRows.filter(r=>REDEMPTION_FILTER.product==='all'||r.product===REDEMPTION_FILTER.product);
  const productList=REDEMPTION_FILTER.product==='all'?[...new Set(basePeriodRows.map(r=>r.product))]:[REDEMPTION_FILTER.product];
  const priceOf=p=>{const r=basePeriodRows.find(x=>x.product===p);return r?r.unitPrice:0;};
  const preferredOrder=['หนึ่ง','แพร','ป้าย','แอ๋ม','แอปเปิ้ล','เกอร์','อชิ','น้ำฝน','เดียร์'];
  const rows=names.map(name=>{
    const rs=periodRows.filter(r=>r.employee===name);
    const rev=sum(rs.map(r=>r.unitPrice*r.units)),totalUnits=sum(rs.map(r=>r.units));
    const u=productList.map(p=>sum(rs.filter(r=>r.product===p).map(r=>r.units)));
    return{name,u,rev,totalUnits};
  }).filter(r=>r.totalUnits>0).sort((a,b)=>b.totalUnits-a.totalUnits||(preferredOrder.indexOf(a.name)-preferredOrder.indexOf(b.name))||b.rev-a.rev);
  const gRev=sum(rows.map(r=>r.rev)),gU=sum(rows.map(r=>r.totalUnits));
  const relevantRows=REDEMPTION_FILTER.employee==='all'?periodRows:periodRows.filter(r=>r.employee===REDEMPTION_FILTER.employee);
  const perProduct=productList.map((p,pi)=>({name:p,icon:['☕','🌸','💧','🧴','✨'][pi%5],color:['#f59e0b','#8b5cf6','#06b6d4','#10b981','#f43f5e'][pi%5],price:priceOf(p),units:sum(relevantRows.filter(r=>r.product===p).map(r=>r.units))}));
  return{rows,gRev,gU,products:productList,perProduct,top:rows[0]||null};
}

function renderGPMonthlyTrend(monthNames){

  if(!show){
    if(CH.gpMonthlyTrendChart){
      CH.gpMonthlyTrendChart.destroy();
      delete CH.gpMonthlyTrendChart;
    }

  }
  const employee=STATE.empB;
  const allBrands=STATE.brand==='all'?DATA.brandMeta:[brandOf(STATE.brand)];
  const rows=RAW.gp.filter(r=>r.y===+STATE.year&&r.employee===employee&&allBrands.some(b=>b.k===r.brand));
  const months=[...new Set(rows.map(r=>r.mo))].sort((a,b)=>a-b);
  const monthly=months.map(m=>{
    const br=allBrands.map(b=>{
      const r=rows.find(x=>x.mo===m&&x.brand===b.k);
      return{b,v:r?r.gpPercent:null,t:r?r.thresholdPercent:null,pass:r?+r.gpPercent>=+r.thresholdPercent:false};
    });
    const known=br.filter(x=>x.v!=null);
    return{m,br,avg:known.length?avg(known.map(x=>x.v)):null,pass:known.filter(x=>x.pass).length,total:known.length};
  });
  const first=monthly.find(x=>x.avg!=null),last=[...monthly].reverse().find(x=>x.avg!=null);
  const change=first&&last?last.avg-first.avg:0;
  const best=monthly.filter(x=>x.avg!=null).sort((a,b)=>b.avg-a.avg)[0];
  const improving=change>0.25,declining=change<-0.25;
  document.getElementById('gpTrendHeading').textContent=`📅 พัฒนาการรายเดือน — ${employee}`;
  document.getElementById('gpTrendTitle').textContent=`แนวโน้ม GP% ของ ${employee} · มกราคม–${last?monthNames[last.m]:'ปัจจุบัน'} ${+STATE.year+543}`;
  document.getElementById('gpTrendSummary').innerHTML=[
    ['เดือนแรก',first?first.avg.toFixed(2)+'%':'—'],
    ['เดือนล่าสุด',last?last.avg.toFixed(2)+'%':'—'],
    ['เปลี่ยนแปลง',`${change>=0?'+':''}${change.toFixed(2)} จุด`],
    ['สรุปพัฒนาการ',improving?'📈 ดีขึ้น':declining?'📉 ลดลง':'➡️ ทรงตัว']
  ].map(x=>`<div class="gp-trend-pill"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('');
  mkChart('gpMonthlyTrendChart',{type:'line',data:{labels:monthly.map(x=>monthNames[x.m]),datasets:[
    ...allBrands.map(b=>({label:b.lb,data:monthly.map(x=>{const z=x.br.find(v=>v.b.k===b.k);return z&&z.v!=null?z.v:null;}),borderColor:b.c,backgroundColor:b.c+'22',pointBackgroundColor:b.c,pointRadius:4,tension:.28,spanGaps:true})),
    {label:'ค่าเฉลี่ย',data:monthly.map(x=>x.avg),borderColor:'#111827',backgroundColor:'#11182718',borderWidth:3,pointRadius:5,pointBackgroundColor:'#fff',pointBorderColor:'#111827',pointBorderWidth:2,tension:.28}
  ]},options:{responsive:true,plugins:{legend:{position:'top',labels:{boxWidth:10,padding:10,font:{size:9}}},tooltip:{callbacks:{label:c=>c.raw==null?` ${c.dataset.label}: ไม่มีข้อมูล`:` ${c.dataset.label}: ${Number(c.raw).toFixed(2)}%`}}},scales:{x:{grid:{color:GR}},y:{grid:{color:GR},suggestedMin:18,suggestedMax:40,ticks:{callback:v=>v+'%'}}}}});
  let h='<thead><tr><th>เดือน</th>'+allBrands.map(b=>`<th>${b.ic} ${b.sh}</th>`).join('')+'<th>เฉลี่ย</th><th>เทียบเดือนก่อน</th><th>ผ่านเกณฑ์</th></tr></thead><tbody>';
  monthly.forEach((x,i)=>{

    const cls=d==null?'':d>.25?'gp-up':d<-.25?'gp-down':'gp-flat';

    h+=`<tr><td>${monthNames[x.m]} ${+STATE.year+543}</td>`;

  });
  document.getElementById('gpTrendTable').innerHTML=h+'</tbody>';
}

function safePctPart(value,max){return max>0?Math.max(0,Math.min(100,value/max*100)):0}
function overallPerformanceRows(so,gp,dly,rd){
  const byName={};
  const get=n=>{const key=EMP_ALIAS[n]||n;return byName[key]||(byName[key]={name:key,sales:0,orders:0,gp:null,daily:null,redemption:0,modules:0})};
  so.rows.forEach(r=>{const x=get(r.name);x.sales=r.rev;x.orders=r.ord;x.modules++});
  gp.rows.forEach(r=>{const x=get(r.name);if(r.avgGP!=null){x.gp=r.avgGP;x.modules++}});
  dly.rows.forEach(r=>{const x=get(r.n);x.daily=(r.pco+r.pcr)/2;x.modules++});
  rd.rows.forEach(r=>{const x=get(r.name);x.redemption=r.rev;x.modules++});
  const vals=Object.values(byName),mx={sales:Math.max(0,...vals.map(x=>x.sales)),orders:Math.max(0,...vals.map(x=>x.orders)),gp:Math.max(0,...vals.map(x=>x.gp||0)),redemption:Math.max(0,...vals.map(x=>x.redemption))};
  vals.forEach(x=>{const parts=[];if(x.sales)parts.push(safePctPart(x.sales,mx.sales));if(x.orders)parts.push(safePctPart(x.orders,mx.orders));if(x.gp!=null)parts.push(safePctPart(x.gp,mx.gp));if(x.daily!=null)parts.push(x.daily);if(x.redemption)parts.push(safePctPart(x.redemption,mx.redemption));x.score=parts.length?avg(parts):0;x.coverage=parts.length});
  return vals.filter(x=>x.coverage).sort((a,b)=>b.score-a.score);
}

  return el;
}

  document.getElementById('insightReportPeriod').textContent=`วิเคราะห์ข้อมูลทุกหัวข้อใน Dashboard เพื่อแยกจุดแข็ง จุดเสี่ยง และลำดับสิ่งที่ควรทำก่อน${insightRange?' · รอบรายงาน '+insightRange:''}`;
  const grid=document.getElementById('insight-grid');grid.innerHTML='';
  const so=computeSO(),gp=computeGP(),dly=computeDaily(),rd=computeRedemption(),m=computeMonthly();
  const insightPeriodKey=STATE.year!=='all'&&STATE.month!=='all'?`${STATE.year}-${String(STATE.month).padStart(2,'0')}`:'';
  const insightMonthlySnapshot=(typeof MONTHLY_FORECAST_DATA!=='undefined'&&MONTHLY_FORECAST_DATA[insightPeriodKey])||null;
  const insightMonthlyTarget=insightMonthlySnapshot?sum(insightMonthlySnapshot.brands.map(b=>b.target)):m.totalMonthTarget;
  const insightMonthlyActual=insightMonthlySnapshot?insightMonthlySnapshot.summaryActual:m.cumulativeActual;
  const insightGap=Math.max(0,insightMonthlyTarget-insightMonthlyActual);
  const insightRemainingDays=insightMonthlySnapshot?Math.max(0,insightMonthlySnapshot.periodDays-insightMonthlySnapshot.rows.length):m.remainingDays;

};
let HS_MONTH='2026-08';
let HOLIDAY_TEAM=HOLIDAY_PERIODS[HS_MONTH].team;
let HS_DATES=[];
const HS_LABEL={M:'06:00–15:00',A:'15:00–00:00',N:'09:00–18:00',O:'หยุด',V:'พักร้อน',L:'ลากิจ',U:'กิจ*',B:'ป่วย',P:'พัก'};
const HS_OFF_CODES=['O','V','L','U','B','P'];
const HS_SHORT_DAY=['อา','จ','อ','พ','พฤ','ศ','ส'];
function availableHolidayMonths(year){
  return Object.keys(HOLIDAY_PERIODS).filter(k=>k.startsWith(year+'-')).sort().reverse();
}
function populateHolidayMonths(year,preferred){
  const sel=document.getElementById('hsMonth');if(!sel)return null;
  const keys=availableHolidayMonths(year);
  const monthNames={1:'มกราคม',2:'กุมภาพันธ์',3:'มีนาคม',4:'เมษายน',5:'พฤษภาคม',6:'มิถุนายน',7:'กรกฎาคม',8:'สิงหาคม',9:'กันยายน',10:'ตุลาคม',11:'พฤศจิกายน',12:'ธันวาคม'};
  sel.innerHTML=keys.map(k=>{const m=Number(k.slice(5));return `<option value="${String(m).padStart(2,'0')}">${monthNames[m]}</option>`}).join('');
  const chosen=keys.includes(`${year}-${preferred}`)?preferred:(keys[0]?.slice(5)||'');
  sel.value=chosen;
  return chosen?`${year}-${chosen}`:null;
}
function setHolidayPeriod(key){
  const p=HOLIDAY_PERIODS[key]||HOLIDAY_PERIODS['2026-08'];
  HS_MONTH=key in HOLIDAY_PERIODS?key:'2026-08';
  HOLIDAY_TEAM=p.team;
  HS_DATES=Array.from({length:p.days},(_,i)=>new Date(Date.UTC(p.start[0],p.start[1],p.start[2]+i)));
  document.getElementById('hsTitle').textContent=`🏖️ ตารางวันหยุด — ${p.label}`;
  const yearSel=document.getElementById('hsYear');if(yearSel)yearSel.value=HS_MONTH.slice(0,4);
  const monthSel=document.getElementById('hsMonth');if(monthSel)monthSel.value=HS_MONTH.slice(5);
}
function populateHolidayEmployees(){
  const sel=document.getElementById('hsEmployee');
  sel.innerHTML='<option value="all">พนักงานทั้งหมด</option>';
  HOLIDAY_TEAM.forEach((p,i)=>sel.insertAdjacentHTML('beforeend',`<option value="${i}">${p.name} — ${p.full} (${p.id})</option>`));
}
function initHolidaySchedule(){
  const sel=document.getElementById('hsEmployee');
  if(!sel)return;
  populateHolidayMonths(HS_MONTH.slice(0,4),HS_MONTH.slice(5));
  setHolidayPeriod(HS_MONTH);
  populateHolidayEmployees();
  renderHolidaySchedule();
}
function changeHolidayYear(year){
  const key=populateHolidayMonths(year,document.getElementById('hsMonth')?.value||'');
  if(key)changeHolidayMonth(key.slice(5));
}
function changeHolidayMonth(month){
  const year=document.getElementById('hsYear')?.value||HS_MONTH.slice(0,4);
  const key=`${year}-${month}`;
  setHolidayPeriod(key);
  populateHolidayEmployees();
  document.getElementById('hsShift').value='all';
  renderHolidaySchedule();
}
function resetHolidayFilters(){
  document.getElementById('hsEmployee').value='all';
  document.getElementById('hsShift').value='all';
  renderHolidaySchedule();
}
function renderHolidaySchedule(){
  const thead=document.getElementById('hsThead'),tbody=document.getElementById('hsTbody');
  if(!thead||!tbody)return;
  const emp=document.getElementById('hsEmployee').value;
  const focus=document.getElementById('hsShift').value;
  const sum=HOLIDAY_TEAM.reduce((a,p)=>{[...p.s].forEach(x=>{a[x]=(a[x]||0)+1});return a},{M:0,A:0,N:0,O:0,V:0,L:0,U:0,B:0,P:0});
  document.getElementById('hsKpiPeople').textContent=HOLIDAY_TEAM.length+' คน';
  const leaveMetric=code=>{
    const people=HOLIDAY_TEAM.filter(p=>p.s.includes(code)).length;
    const days=HOLIDAY_TEAM.reduce((n,p)=>n+[...p.s].filter(x=>x===code).length,0);
    return {people,days};
  };
  const leaveCards=[
    ['hsKpiVacation','V','วัน'],
    ['hsKpiBusiness','L','วัน'],
    ['hsKpiUnpaid','U','วัน'],
    ['hsKpiSick','B','วัน']
  ];
  leaveCards.forEach(([id,code,unit])=>{
    const metric=leaveMetric(code);
    document.getElementById(id).textContent=`${metric.people} คน | ${metric.days} ${unit}`;
  });
  const heads=HS_DATES.map(d=>{const wk=d.getUTCDay()===0||d.getUTCDay()===6;return `<th class="${wk?'weekend':''}">${HS_SHORT_DAY[d.getUTCDay()]}<br><b>${d.getUTCDate()}</b></th>`}).join('');
  thead.innerHTML=`<tr><th>ชื่อ / เวลาทำงาน</th>${heads}<th class="sum" style="background:#dc2626">วันหยุด</th><th class="sum" style="background:#db2777">กะเช้า</th><th class="sum" style="background:#059669">กะบ่าย</th><th class="sum" style="background:#4338ca">กะปกติ</th><th class="sum" style="background:#0f766e">วันทำงาน</th></tr>`;
  tbody.innerHTML=HOLIDAY_TEAM.map((p,i)=>{
    const c={M:0,A:0,N:0,O:0,V:0,L:0,U:0,B:0,P:0};[...p.s].forEach(x=>c[x]=(c[x]||0)+1);
    const cells=[...p.s].map(x=>`<td class="shift-${x}" style="${focus!=='all'&&focus!==x?'opacity:.18;filter:grayscale(.7)':''}">${HS_LABEL[x]}</td>`).join('');
    const off=HS_OFF_CODES.reduce((n,k)=>n+(c[k]||0),0);
    return `<tr class="${emp!=='all'&&emp!=i?'is-hidden':''}"><td><div class="hs-name"><b>${p.full} <span style="color:#64748b;font-weight:700">(${p.name})</span></b>${p.meta==='WFH'?'<span class="hs-badge">🏠 WFH</span>':''}<small>${p.id}</small></div></td>${cells}<td class="sum off">${off}</td><td class="sum morning">${c.M}</td><td class="sum after">${c.A}</td><td class="sum normal">${c.N}</td><td class="sum work">${c.M+c.A+c.N}</td></tr>`;
  }).join('');
  const shown=emp==='all'?HOLIDAY_TEAM.length:1;
  const period=HOLIDAY_PERIODS[HS_MONTH];
  document.getElementById('hsTableStatus').textContent=`กำลังแสดง ${shown} คน · ${period.range} · ${period.days} วัน`;
  renderDailyShiftCounts();
}
function renderDailyShiftCounts(){
  const thead=document.getElementById('hsCountThead'),tbody=document.getElementById('hsCountTbody');
  if(!thead||!tbody)return;
  const countedTeam=HOLIDAY_TEAM.filter(p=>p.meta!=='Supervisor');
  const countStatus=document.getElementById('hsCountStatus');
  if(countStatus)countStatus.textContent=`ไม่นับ Supervisor · รวมพนักงาน ${countedTeam.length} คน`;
  const heads=HS_DATES.map(d=>{const wk=d.getUTCDay()===0||d.getUTCDay()===6;return `<th class="${wk?'weekend':''}">${HS_SHORT_DAY[d.getUTCDay()]}<br><b>${d.getUTCDate()}</b></th>`}).join('');
  thead.innerHTML=`<tr><th>ประเภทกะ / สถานะ</th>${heads}<th class="total-head">รวมทั้งรอบ</th></tr>`;
  const rows=[
    {key:'M',icon:'🌞',label:'กะเช้า',color:'#db2777'},
    {key:'A',icon:'🌙',label:'กะบ่าย',color:'#059669'},
    {key:'N',icon:'🕘',label:'กะปกติ',color:'#4338ca'},
    {key:'X',icon:'🏖️',label:'หยุด / ลา',color:'#dc2626'}
  ];
  tbody.innerHTML=rows.map(row=>{
    const daily=HS_DATES.map((_,day)=>countedTeam.filter(p=>row.key==='X'?HS_OFF_CODES.includes(p.s[day]):p.s[day]===row.key).length);
    return `<tr><td><span class="hs-count-label" style="color:${row.color}"><i></i><strong>${row.icon} ${row.label}</strong></span></td>${daily.map(n=>`<td class="count-${row.key}"><b>${n}</b></td>`).join('')}<td class="count-total">${daily.reduce((a,b)=>a+b,0)}</td></tr>`;
  }).join('');
}

/* ══════════════════════════════════════════════════════════════════
   SECTION 14 — BOOTSTRAP
   ══════════════════════════════════════════════════════════════════ */
async function bootstrap(){
  await loadAllData();      // โหลดจาก Google Sheets ถ้าตั้งค่าไว้ ไม่งั้น fallback ไปข้อมูลตัวอย่าง
  initFilterOptions();
  initHolidaySchedule();
  refreshChips();
  showPage('pg-dashboard');
}
bootstrap();
</script>
</body>
